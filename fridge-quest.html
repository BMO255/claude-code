// ---------------- core constants / boot ----------------
const W = 320, H = 240;
const screenCv = document.getElementById("screen");
const sctx = screenCv.getContext("2d");
const vc = document.createElement("canvas"); vc.width = W; vc.height = H;
const ctx = vc.getContext("2d");
ctx.imageSmoothingEnabled = false;
let SCALE = 2;
function fitScreen(){
  SCALE = Math.max(1, Math.floor(Math.min(innerWidth / W, (innerHeight - 20) / H)));
  screenCv.width = W * SCALE; screenCv.height = H * SCALE;
  sctx.imageSmoothingEnabled = false;
}
addEventListener("resize", fitScreen); fitScreen();

// ---------------- utils ----------------
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const irnd = (a, b) => Math.floor(rnd(a, b + 1));
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const overlaps = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  ArrowLeft:"left", KeyA:"left", ArrowRight:"right", KeyD:"right",

  KeyX:"x", ShiftLeft:"x", ShiftRight:"x",
  KeyC:"c", ControlLeft:"c", ControlRight:"c",
  KeyM:"m"
};

  const k = KEYMAP[e.code];
  if (k){ e.preventDefault(); if (!held[k]) pressed[k] = true; held[k] = true; }

});

  const k = KEYMAP[e.code];
  if (k){ held[k] = false; }

const FONT_CHARS = Object.keys(FONT);
const glyphAtlas = {}; // color -> canvas
function atlasFor(color){
  if (glyphAtlas[color]) return glyphAtlas[color];
  const c = document.createElement("canvas");
  c.width = FONT_CHARS.length * 6; c.height = 7;
  const g = c.getContext("2d"); g.fillStyle = color;
  FONT_CHARS.forEach((ch, i) => {
    const rows = FONT[ch];
    for (let y = 0; y < 7; y++)
      for (let x = 0; x < 5; x++)
        if (rows[y] >> (4 - x) & 1) g.fillRect(i * 6 + x, y, 1, 1);
  });
  glyphAtlas[color] = c; return c;
}
function drawText(s, x, y, color = "#ffffff"){
  const at = atlasFor(color);
  s = String(s).toUpperCase();
  let cx = x | 0;
  for (const ch of s){
    const i = FONT_CHARS.indexOf(FONT[ch] ? ch : " ");
    ctx.drawImage(at, i * 6, 0, 6, 7, cx, y | 0, 6, 7);
    cx += 6;
  }
}
function textW(s){ return String(s).length * 6; }
function drawTextC(s, cx, y, color){ drawText(s, cx - textW(s) / 2, y, color); }
// wrap text into lines of max chars
function wrapText(s, maxChars){
  const words = String(s).split(" "), lines = []; let cur = "";
  for (const w of words){
    if ((cur + (cur ? " " : "") + w).length <= maxChars) cur += (cur ? " " : "") + w;
    else { if (cur) lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  return lines;
}

  ctx.fillStyle = border; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = bg; ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
}

<script>
"use strict";
// ================= AUDIO: chiptune engine =================
let AC = null, masterGain = null, musicGain = null, sfxGain = null;
let muted = false;
function audioBoot(){
  if (AC) { if (AC.state === "suspended") AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) { return; }
  masterGain = AC.createGain(); masterGain.gain.value = 0.55; masterGain.connect(AC.destination);
  musicGain = AC.createGain(); musicGain.gain.value = 0.5; musicGain.connect(masterGain);
  sfxGain = AC.createGain(); sfxGain.gain.value = 0.9; sfxGain.connect(masterGain);
  makeNoiseBuf();
  makeEcho();
  if (pendingSong) playMusic(pendingSong);
}
function toggleMute(){
  muted = !muted;
  if (masterGain) masterGain.gain.value = muted ? 0 : 0.55;
}
let noiseBuf = null;
function makeNoiseBuf(){
  noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
// SNES-flavored ambience: a filtered feedback delay all music runs through
let echoDelay = null;
function makeEcho(){
  echoDelay = AC.createDelay(0.6); echoDelay.delayTime.value = 0.26;
  const fb = AC.createGain(); fb.gain.value = 0.32;
  const damp = AC.createBiquadFilter(); damp.type = "lowpass"; damp.frequency.value = 2300;
  echoDelay.connect(damp); damp.connect(fb); fb.connect(echoDelay);
  const wet = AC.createGain(); wet.gain.value = 0.5;
  echoDelay.connect(wet); wet.connect(musicGain);
}
// one music note: dual detuned oscillators + vibrato + lowpass + echo send
function scheduleNote(tr, midi, t0, durS){
  const f = freqOf(midi);
  const g = AC.createGain();
  const lp = AC.createBiquadFilter(); lp.type = "lowpass";
  lp.frequency.value = Math.min(9500, f * (tr.wave === "triangle" ? 6 : tr.wave === "sawtooth" ? 3 : 3.5));
  g.connect(lp); lp.connect(musicGain);
  if (echoDelay){
    const send = AC.createGain();
    send.gain.value = tr.echo !== undefined ? tr.echo : (tr.wave === "triangle" ? 0.10 : 0.30);
    lp.connect(send); send.connect(echoDelay);
  }
  const atk = 0.018, rel = 0.05;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(tr.vol, t0 + atk);
  g.gain.setValueAtTime(tr.vol, t0 + Math.max(atk, durS - rel));
  g.gain.linearRampToValueAtTime(0.0001, t0 + durS + 0.02);
  const lfo = AC.createOscillator(); lfo.frequency.value = 5.3;
  const lfoG = AC.createGain(); lfoG.gain.value = f * 0.005;
  lfo.connect(lfoG);
  [-4, 4].forEach(det => {
    const o = AC.createOscillator();
    o.type = tr.wave; o.frequency.value = f; o.detune.value = det;
    lfoG.connect(o.frequency);
    const og = AC.createGain(); og.gain.value = 0.5;
    o.connect(og); og.connect(g);
    o.start(t0); o.stop(t0 + durS + 0.06);
  });
  lfo.start(t0); lfo.stop(t0 + durS + 0.06);
}
const NOTE_RE = /^([A-G])(#?)(\d)$/;
function midiOf(tok){
  const m = NOTE_RE.exec(tok); if (!m) return null;
  const base = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 }[m[1]] + (m[2] ? 1 : 0);
  return 12 * (Number(m[3]) + 1) + base;
}
const freqOf = midi => 440 * Math.pow(2, (midi - 69) / 12);

// --- one-shot tone helper (SFX) ---
function tone(freq, dur, wave = "square", vol = 0.25, slideTo = 0, delay = 0, dest = null){
  if (!AC || muted) return;
  const t0 = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = wave; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(dest || sfxGain);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function noiseHit(dur, vol = 0.3, rate = 1, delay = 0, dest = null){
  if (!AC || muted || !noiseBuf) return;
  const t0 = AC.currentTime + delay;
  const s = AC.createBufferSource(); s.buffer = noiseBuf; s.playbackRate.value = rate;
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  s.connect(g); g.connect(dest || sfxGain);
  s.start(t0); s.stop(t0 + dur + 0.02);
}

// --- music sequencer ---
// Sequences: tokens on an 8th-note grid. "." = rest, "~" = hold previous note.
function parseSeq(seq){
  const toks = seq.trim().split(/\s+/), ev = [];
  for (let i = 0; i < toks.length; i++){
    if (toks[i] === "." || toks[i] === "~") continue;
    const m = midiOf(toks[i]); if (m === null) continue;
    let d = 1; while (toks[i + d] === "~") d++;
    ev.push({ step: i, midi: m, dur: d });
  }
  return { events: ev, len: toks.length };
}

let curSong = null, songTimer = null, songStep = 0, nextStepT = 0, pendingSong = null;
let parsedSongs = {};
function playMusic(name){
  pendingSong = name;
  if (!AC) return;
  if (curSong === name && songTimer) return;
  stopMusic();
  if (!name || !SONGS[name]) return;
  curSong = name;
  if (!parsedSongs[name]){
    const s = SONGS[name];
    parsedSongs[name] = {
      bpm: s.bpm,
      tracks: s.tracks.map(t => ({ wave: t.wave, vol: t.vol, ...parseSeq(t.seq) })),
      noise: s.noise ? s.noise.trim().split(/\s+/) : null
    };
  }
  songStep = 0; nextStepT = AC.currentTime + 0.08;
  songTimer = setInterval(musicTick, 30);
}
function stopMusic(){
  if (songTimer){ clearInterval(songTimer); songTimer = null; }
  curSong = null; pendingSong = null;
}
function musicTick(){
  if (!AC || !curSong) return;
  const song = parsedSongs[curSong];
  const stepDur = 30 / song.bpm; // 8th note
  if (nextStepT < AC.currentTime - 0.1) nextStepT = AC.currentTime + 0.05; // re-anchor after tab throttling
  while (nextStepT < AC.currentTime + 0.15){
    const t0 = nextStepT;
    for (const tr of song.tracks){
      const st = songStep % tr.len;
      for (const ev of tr.events){
        if (ev.step !== st) continue;
        if (muted) continue;
        scheduleNote(tr, ev.midi, t0, ev.dur * stepDur);
      }
    }
    if (song.noise && !muted){
      const n = song.noise[songStep % song.noise.length];
      if (n === "h") noiseAt(t0, 0.03, 0.10, 2.6, "hat");
      else if (n === "s") noiseAt(t0, 0.09, 0.22, 1.2, "snare");
      else if (n === "k"){ noiseAt(t0, 0.05, 0.16, 0.4, "kick");
        const o = AC.createOscillator(), g = AC.createGain();
        o.type = "triangle"; o.frequency.setValueAtTime(110, t0);
        o.frequency.exponentialRampToValueAtTime(45, t0 + 0.09);
        g.gain.setValueAtTime(0.3, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.09);
        o.connect(g); g.connect(musicGain); o.start(t0); o.stop(t0 + 0.1);
      }
    }
    songStep++;
    nextStepT += stepDur;
  }
}
function noiseAt(t0, dur, vol, rate, kind){
  const s = AC.createBufferSource(); s.buffer = noiseBuf; s.playbackRate.value = rate;
  const g = AC.createGain();
  const f = AC.createBiquadFilter();
  if (kind === "hat"){ f.type = "highpass"; f.frequency.value = 6500; }
  else if (kind === "snare"){ f.type = "bandpass"; f.frequency.value = 1900; f.Q.value = 0.7; }
  else { f.type = "lowpass"; f.frequency.value = 2400; }
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(musicGain);
  if (kind === "snare" && echoDelay){ const sd = AC.createGain(); sd.gain.value = 0.22; g.connect(sd); sd.connect(echoDelay); }
  s.start(t0); s.stop(t0 + dur + 0.02);
}
function playJingle(kind){
  stopMusic();
  if (kind === "victory") [523, 523, 523, 659, 784, 1047].forEach((f, i) => tone(f, i >= 4 ? 0.3 : 0.09, "square", 0.16, 0, i * 0.1));
  if (kind === "gameover") [440, 415, 392, 370].forEach((f, i) => tone(f, 0.5, "triangle", 0.2, f * 0.98, i * 0.45));
}

// ================= SPRITES: procedural pixel art =================
// Build a canvas from ASCII rows + palette. Unknown/'.'/' ' chars = transparent.
// Sprites get an automatic 1px dark outline (Deltarune-style) unless outline is null.
function S(rows, pal, outline = "#12121c"){
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const c = document.createElement("canvas"); c.width = w + 2; c.height = h + 2;
  const g = c.getContext("2d");
  const occ = new Set();
  for (let y = 0; y < h; y++)
    for (let x = 0; x < rows[y].length; x++){
      const col = pal[rows[y][x]];
      if (col){ g.fillStyle = col; g.fillRect(x + 1, y + 1, 1, 1); occ.add((x + 1) * 1000 + y + 1); }
    }
  if (outline){
    g.fillStyle = outline;
    const edge = new Set();
    for (const k of occ){
      const x = Math.floor(k / 1000), y = k % 1000;
      for (const [ox, oy] of [[1,0],[-1,0],[0,1],[0,-1]])
        if (!occ.has((x + ox) * 1000 + y + oy)) edge.add((x + ox) * 1000 + y + oy);
    }
    for (const k of edge) g.fillRect(Math.floor(k / 1000), k % 1000, 1, 1);
  }
  return c;
}

  if (o.flip) ctx.scale(-1, 1);
  if (o.alpha !== undefined) ctx.globalAlpha = o.alpha;
  ctx.drawImage(cv, 0, 0, cv.width * sc, cv.height * sc);
  ctx.restore();
}

function saveGame(){
  try {

      party: G.party.map(p => ({ id: p.id, hp: p.hp, maxhp: p.maxhp, atk: p.atk })),

}

function loadGame(){
  let d = null;

  if (!d) return false;
  G.party = newParty();
  if (d.party.length > 3) addBob();

// ---------------- dialogue system ----------------
const VOICES = { dorko: 320, mega: 470, bmo: 760, kongy: 170, glacion: 220, default: 540 };
function say(script, onEnd){
  G.dialog = { script, i: 0, chars: 0, choiceIdx: 0, onEnd, lines: null };
  prepNode();
}
function prepNode(){
  const d = G.dialog, n = d.script[d.i];
  const maxChars = n.p ? 42 : 48;
  d.lines = wrapText(n.t, maxChars);
  d.total = d.lines.join(" ").length;
  d.chars = 0; d.choiceIdx = 0;
  if (n.sfx) n.sfx();
}
function updateDialog(){
  const d = G.dialog, n = d.script[d.i];
  if (d.chars < d.total){
    d.chars += held.x ? 3 : 1;
    if (d.chars >= d.total) d.chars = d.total;
    else if (G.t % 3 === 0){
      const f = VOICES[n.p] || VOICES.default;
      tone(f * rnd(0.95, 1.08), 0.04, n.p === "bmo" ? "triangle" : "square", 0.1);
    }
    if (pressed.z){ eat("z"); d.chars = d.total; }
    return;
  }
  if (n.choices){
    if (pressed.left || pressed.up){ eat("left"); eat("up"); d.choiceIdx = (d.choiceIdx + n.choices.length - 1) % n.choices.length; SFX.move(); }
    if (pressed.right || pressed.down){ eat("right"); eat("down"); d.choiceIdx = (d.choiceIdx + 1) % n.choices.length; SFX.move(); }
    if (pressed.z){
      eat("z"); SFX.confirm();
      const ch = n.choices[d.choiceIdx];
      if (ch.fn){ closeDialog(); ch.fn(); return; }
      if (ch.j !== undefined){ d.i = ch.j; prepNode(); return; }
      advanceDialog();
    }
    return;
  }
  if (pressed.z){
    eat("z");
    if (n.fn){ closeDialog(); n.fn(); return; }
    if (n.j !== undefined){ G.dialog.i = n.j; prepNode(); return; }
    advanceDialog();
  }
}
function advanceDialog(){
  const d = G.dialog;
  d.i++;
  if (d.i >= d.script.length) closeDialog();
  else prepNode();
}
function closeDialog(){
  const cb = G.dialog ? G.dialog.onEnd : null;
  G.dialog = null;
  if (cb) cb();
}
function drawDialog(){
  const d = G.dialog; if (!d) return;
  const n = d.script[d.i];
  drawBox(6, 170, 308, 64);
  let tx = 16, ty = 180;
  if (n.p && PORTRAITS[n.p]){
    drawBox(12, 178, 32, 32, "#101018", "#8a93a8");
    ctx.drawImage(PORTRAITS[n.p], 16, 183);
    tx = 52;
  }
  if (n.name) { drawText(n.name, tx, 176, "#ffe14a"); ty = 186; }
  let remaining = d.chars;
  for (let li = 0; li < d.lines.length; li++){
    if (remaining <= 0) break;
    const line = d.lines[li];
    drawText(line.slice(0, remaining), tx, ty + li * 10);
    remaining -= line.length + 1;
  }
  if (d.chars >= d.total && n.choices){
    const cw = Math.floor(296 / n.choices.length);
    n.choices.forEach((c, i) => {
      const cx = 12 + i * cw + cw / 2;
      drawTextC(c.t, cx + 4, 222, i === d.choiceIdx ? "#ffe14a" : "#9aa2b8");
      if (i === d.choiceIdx) ctx.drawImage(soulSpr, cx - textW(c.t) / 2 - 6, 222);
    });
  } else if (d.chars >= d.total && (G.t >> 4) % 2 === 0){
    drawText("@", 300, 224, "#e03050");
  }
}

// deco helpers
function checkerFloor(w, h, col, s = 18, y0 = 0){
  ctx.fillStyle = col;
  for (let y = y0; y < h; y += s)
    for (let x = (((y - y0) / s) % 2) * s; x < w; x += s * 2)
      ctx.fillRect(x, y, s, s);
}
function diamondFloor(w, h, col, s = 16){
  ctx.fillStyle = col;
  const hs = Math.floor(s * 0.32);
  for (let y = 0; y <= h + s; y += s)
    for (let x = ((y / s) % 2) * s * 0.5 * 2; x <= w + s; x += s * 2){
      ctx.beginPath();
      ctx.moveTo(x, y - hs); ctx.lineTo(x + hs, y); ctx.lineTo(x, y + hs); ctx.lineTo(x - hs, y);
      ctx.fill();
    }
}
function plankFloor(w, h, line, s = 18, y0 = 0){
  ctx.fillStyle = line;
  for (let y = y0; y < h; y += s){
    ctx.fillRect(0, y, w, 2);
    for (let x = ((y / s) % 3) * 40 + 14; x < w; x += 110) ctx.fillRect(x, y + 2, 2, s - 2);
  }
}
function wallFace(x, y, w, h, top, face){
  ctx.fillStyle = top; ctx.fillRect(x, y, w, h - 12);

  ctx.fillStyle = "rgba(0,0,0,0.25)"; ctx.fillRect(x, y + h - 3, w, 3);
  ctx.fillStyle = "rgba(255,255,255,0.06)";
  for (let px = x + 6; px < x + w; px += 26) ctx.fillRect(px, y + h - 12, 2, 9);
}

// ---------------- freezer ice-block puzzle ----------------
const ICE_BARRIER = { x:536, y:120, w:16, h:56 };
const PUZZLE_BLOCK_STARTS = [[500, 140], [450, 240]];
const PUZZLE_PLATES = [[450, 140], [510, 240]];
let puzzleBlocks = [];
function blockRect(b){ return { x: b.x - 8, y: b.y - 8, w: 16, h: 16 }; }
function resetPuzzle(){
  puzzleBlocks = G.flags.icePuzzle
    ? PUZZLE_PLATES.map(([x, y]) => ({ x, y, locked: true }))
    : PUZZLE_BLOCK_STARTS.map(([x, y]) => ({ x, y, locked: false }));
}
function tryPushBlock(sx, sy, nb){
  if (G.roomId !== "freezer") return;
  const b = puzzleBlocks.find(bl => !bl.locked && overlaps(nb, blockRect(bl)));
  if (!b) return;
  const room = ROOMS.freezer, step = 0.8;
  const nr = { x: b.x - 8 + sx * step, y: b.y - 8 + sy * step, w: 16, h: 16 };
  for (const wl of room.walls) if (overlaps(nr, wl)) return;
  if (!G.flags.icePuzzle && overlaps(nr, ICE_BARRIER)) return;
  for (const ob of puzzleBlocks) if (ob !== b && overlaps(nr, blockRect(ob))) return;
  for (const n of room.npcs){
    if (n.needFlag && !G.flags[n.needFlag]) continue;
    if (n.hideFlag && G.flags[n.hideFlag]) continue;
    if (n.solid && overlaps(nr, { x: n.x - n.w / 2, y: n.y - n.h / 2, w: n.w, h: n.h })) return;
  }
  if (nr.x < 12 || nr.y < 12 || nr.x + 16 > room.w - 12 || nr.y + 16 > room.h - 12) return;
  b.x += sx * step; b.y += sy * step;
  const nb2 = feetBox(player.x + sx * step, player.y + sy * step);
  if (!collides(nb2, room)){ player.x += sx * step; player.y += sy * step; }
  if (G.t % 9 === 0) SFX.blip2();
  for (const [px2, py2] of PUZZLE_PLATES){
    if (puzzleBlocks.some(ob => ob.locked && ob.x === px2 && ob.y === py2)) continue;
    if (Math.abs(b.x - px2) < 5 && Math.abs(b.y - py2) < 5){
      b.x = px2; b.y = py2; b.locked = true;
      SFX.confirm(); shake(2, 6);
      if (puzzleBlocks.every(bl => bl.locked) && !G.flags.icePuzzle){
        G.flags.icePuzzle = 1;
        SFX.heal(); shake(3, 12);
        say([{ t:"THE WARM SPOTS HUM IN HARMONY. ACROSS THE ROOM, THE ICE DOOR SIGHS... AND MELTS INTO STEAM." }]);
      }
      break;
    }
  }
}
function drawPuzzle(){
  for (const [px2, py2] of PUZZLE_PLATES){
    const occupied = puzzleBlocks.some(b => b.locked && b.x === px2 && b.y === py2);
    ctx.globalAlpha = occupied ? 0.95 : 0.55 + 0.25 * Math.sin(G.t / 14);
    ctx.fillStyle = "#e08a30"; ctx.fillRect(px2 - 9, py2 - 9, 18, 18);
    ctx.fillStyle = "#ffc86a"; ctx.fillRect(px2 - 6, py2 - 6, 12, 12);
    ctx.globalAlpha = 1;
  }
  if (!G.flags.icePuzzle){
    icePillar(536, 92, 16, 86);
    ctx.fillStyle = `rgba(255,255,255,${0.22 + 0.14 * Math.sin(G.t / 10)})`;
    ctx.fillRect(538, 122, 4, 52);
  }
}

// npc talk counters
const talkCounts = {};

// ---------------- room transitions ----------------
function enterRoom(id, x, y, instant){
  G.roomId = id; player.x = x; player.y = y; player.trail = [];
  G.invuln = 60;
  for (const k in spawnState) delete spawnState[k];
  if (id === "freezer") resetPuzzle();
  if (id === "room102") G.padProg = 0;
  const r = ROOMS[id];
  G.cam.x = r.w < W ? (r.w - W) / 2 : clamp(x - W / 2, 0, r.w - W);
  G.cam.y = r.h < H ? (r.h - H) / 2 : clamp(y - H / 2, 0, r.h - H);
  playMusic(r.music);
  if (instant){ G.fade.a = 1; G.fade.dir = -1; G.fade.cb = null; }
}
function transitionTo(id, x, y){
  G.fade.dir = 1;
  G.fade.cb = () => { enterRoom(id, x, y); G.fade.dir = -1; G.fade.cb = null; };
}
function updateFade(){
  if (G.fade.dir !== 0){
    G.fade.a = clamp(G.fade.a + G.fade.dir * 0.06, 0, 1);
    if (G.fade.dir > 0 && G.fade.a >= 1){ const cb = G.fade.cb; G.fade.dir = 0; if (cb) cb(); }
    if (G.fade.dir < 0 && G.fade.a <= 0){ G.fade.dir = 0; }
  }
}
function drawFade(){
  if (G.fade.a > 0){ ctx.fillStyle = `rgba(4,5,10,${G.fade.a})`; ctx.fillRect(0, 0, W, H); }
}

// ---------------- overworld update ----------------
function feetBox(x, y){ return { x: x - 5, y: y - 5, w: 10, h: 8 }; }
function collides(box, room){
  for (const wl of room.walls) if (overlaps(box, wl)) return true;
  if (G.roomId === "freezer"){
    if (!G.flags.icePuzzle && overlaps(box, ICE_BARRIER)) return true;
    for (const b of puzzleBlocks) if (overlaps(box, blockRect(b))) return true;
  }
  if (G.roomId === "hotelhall" && !G.flags.keycard && overlaps(box, KEY_BARRIER)) return true;
  for (const bar of CH3_BARRIERS)
    if (bar.room === G.roomId && !G.flags[bar.flag] && overlaps(box, bar.rect)) return true;
  for (const n of room.npcs){
    if (n.needFlag && !G.flags[n.needFlag]) continue;
    if (n.hideFlag && G.flags[n.hideFlag]) continue;
    if (!n.solid) continue;
    if (overlaps(box, { x: n.x - n.w / 2, y: n.y - n.h / 2, w: n.w, h: n.h })) return true;
  }
  return false;
}
const spawnState = {};
function spawnPos(sp){
  let s = spawnState[sp.id];
  if (!s) s = spawnState[sp.id] = { x: sp.x, y: sp.y };
  return s;
}
function updateSpawn(sp){
  const s = spawnPos(sp);
  const d = dist(player.x, player.y, s.x, s.y);
  if (d < 80 && d > 2 && G.invuln <= 0){
    s.x += (player.x - s.x) / d * 0.75;
    s.y += (player.y - s.y) / d * 0.75;
  } else {
    const off = Math.sin(G.t * sp.patrol.spd) * sp.patrol.range;
    const tx = sp.x + (sp.patrol.axis === "x" ? off : 0);
    const ty = sp.y + (sp.patrol.axis === "y" ? off : 0);
    s.x += (tx - s.x) * 0.05; s.y += (ty - s.y) * 0.05;
  }
}
function updateWorld(){
  const room = ROOMS[G.roomId];
  updateFade();
  // if the fade callback just switched rooms, everything below would run against
  // the OLD room's walls/clamps with the NEW spawn position — resume next frame
  if (ROOMS[G.roomId] !== room) return;
  if (G.fade.dir !== 0 && G.fade.cb) return;
  if (G.invuln > 0) G.invuln--;

  if (G.menu){ updateWorldMenu(); return; }
  if (G.dialog){ updateDialog(); return; }

  if (pressed.c){ eat("c"); SFX.confirm(); G.menu = { view: "main", sel: 0, itemSel: 0, target: 0 }; return; }

  // movement
  const spd = held.x ? 2.3 : 1.4;
  let dx = 0, dy = 0;
  if (held.left) dx -= 1; if (held.right) dx += 1;
  if (held.up) dy -= 1; if (held.down) dy += 1;
  player.moving = !!(dx || dy);
  if (player.moving){
    if (dx && dy){ dx *= 0.707; dy *= 0.707; }
    if (dy < 0) player.dir = "up"; else if (dy > 0) player.dir = "down";
    if (dx < 0) player.dir = "left"; else if (dx > 0) player.dir = "right";
    let nb = feetBox(player.x + dx * spd, player.y);
    if (!collides(nb, room)) player.x += dx * spd;
    else if (dx) tryPushBlock(Math.sign(dx), 0, nb);
    nb = feetBox(player.x, player.y + dy * spd);
    if (!collides(nb, room)) player.y += dy * spd;
    else if (dy) tryPushBlock(0, Math.sign(dy), nb);
    player.x = clamp(player.x, 8, room.w - 8);
    player.y = clamp(player.y, 8, room.h - 8);
    player.trail.push({ x: player.x, y: player.y, dir: player.dir });
    if (player.trail.length > 80) player.trail.shift();
  }

  // camera (rooms smaller than the screen render centered)
  G.cam.x = room.w < W ? (room.w - W) / 2 : clamp(player.x - W / 2, 0, room.w - W);
  G.cam.y = room.h < H ? (room.h - H) / 2 : clamp(player.y - H / 2, 0, room.h - H);

  // room-specific per-frame logic (e.g. hotel pad puzzle)
  if (room.tick) room.tick();

  // exits
  const fb = feetBox(player.x, player.y);
  for (const ex of room.exits){
    if (overlaps(fb, ex)){ transitionTo(ex.to, ex.tx, ex.ty); return; }
  }

  // enemy contact
  for (const sp of room.spawns){
    if (G.flags[sp.flag]) continue;
    updateSpawn(sp);
    const p = spawnPos(sp);
    if (G.invuln <= 0 && overlaps(fb, { x: p.x - 9, y: p.y - 8, w: 18, h: 16 })){
      startBattle(sp.group, sp.flag);
      return;
    }
  }

  // interact
  if (pressed.z){
    eat("z");
    const px = player.x + (player.dir === "left" ? -16 : player.dir === "right" ? 16 : 0);
    const py = player.y + (player.dir === "up" ? -16 : player.dir === "down" ? 16 : 0);
    // save points
    for (const sv of room.saves){
      if (dist(px, py, sv.x, sv.y) < 20 || dist(player.x, player.y, sv.x, sv.y) < 24){
        SFX.save();
        G.party.forEach(p => p.hp = p.maxhp);
        saveGame();
        say([{ t: pick([
          "THE QUIET HUM OF THE FRIDGE FILLS YOU WITH CHILL DETERMINATION.",
          "SOMEWHERE, AN ICE CUBE CRACKS. YOU FEEL VALIDATED. HP RESTORED.",
          "THE LITTLE LIGHT TURNS ON JUST FOR YOU. HP RESTORED. GAME SAVED."
        ]) + " (GAME SAVED)" }]);
        return;
      }
    }
    let best = null, bestD = 1e9;
    for (const n of room.npcs){
      if (n.needFlag && !G.flags[n.needFlag]) continue;
      if (n.hideFlag && G.flags[n.hideFlag]) continue;
      const dProbe = dist(px, py, n.x, n.y), dBody = dist(player.x, player.y, n.x, n.y);
      if (dProbe < 24 || dBody < 28){
        const d = Math.min(dProbe, dBody);
        if (d < bestD){ bestD = d; best = n; }
      }
    }
    if (best){
      SFX.interact();
      talkCounts[best.id] = (talkCounts[best.id] || 0) + 1;
      const script = best.dlg(talkCounts[best.id] - 1);
      if (script) say(script);
      return;
    }
  }
}

// ---------------- overworld render ----------------
function partyMember(i){
  // i=0 leader, 1,2 followers; returns {x,y,dir,walking}
  if (i === 0) return { x: player.x, y: player.y, dir: player.dir, walking: player.moving };
  const back = i * 14;
  const t = player.trail;
  if (t.length > back){
    const p = t[t.length - 1 - back];
    return { x: p.x, y: p.y, dir: p.dir, walking: player.moving };
  }
  return { x: player.x, y: player.y, dir: player.dir, walking: false };
}
function drawCharSprite(mem, pos){
  const spr = pos.dir === "up" ? mem.sprB : mem.sprF;
  const flip = pos.dir === "left";
  const yo = bob(G.t, pos.walking);
  shadow(pos.x, pos.y, 7);
  if (mem.hp <= 0) ctx.globalAlpha = 0.5;
  drawSpr(spr, pos.x - spr.width / 2, pos.y - spr.height + 3 + yo, { flip });
  ctx.globalAlpha = 1;
}
const darkOverlay = document.createElement("canvas");
darkOverlay.width = W; darkOverlay.height = H;
function drawWorld(){
  const room = ROOMS[G.roomId];
  ctx.save();
  if (G.shake > 0){ ctx.translate(irnd(-G.shakeMag, G.shakeMag), irnd(-G.shakeMag, G.shakeMag)); }
  ctx.translate(-Math.round(G.cam.x), -Math.round(G.cam.y));
  ctx.fillStyle = room.floor; ctx.fillRect(0, 0, room.w, room.h);
  room.deco();

  // collect drawables, sort by y
  const items = [];
  for (const n of room.npcs){
    if (n.needFlag && !G.flags[n.needFlag]) continue;
    if (n.hideFlag && G.flags[n.hideFlag]) continue;
    if (n.chest){
      items.push({ y: n.y, draw(){
        drawSpr(G.flags[n.flag] ? chestOpen : chestClosed, n.x - 6, n.y - 8, {});
        if (!G.flags[n.flag] && (G.t >> 4) % 2 === 0) drawText("*", n.x + 6, n.y - 14, "#ffe14a");
      } });
    } else if (n.sign && !n.spr){
      if (!n.noDraw) items.push({ y: n.y, draw(){ signPost(n.x, n.y); } });
    } else if (n.spr){
      items.push({ y: n.y, draw(){
        const yo = n.id === "kongy" ? Math.floor(Math.sin(G.t / 20) * 1.5) : 0;
        shadow(n.x, n.y + 2, n.spr.width * 0.38);
        drawSpr(n.spr, n.x - n.spr.width / 2, n.y - n.spr.height + 5 + yo, {});
      } });
    }
  }
  for (const sv of room.saves){
    items.push({ y: sv.y, draw(){
      const f = (G.t >> 4) % 2 === 0 ? saveSpr1 : saveSpr2;
      drawSpr(f, sv.x - 4, sv.y - 8, {});
    } });
  }
  for (const sp of room.spawns){
    if (G.flags[sp.flag]) continue;
    const p = spawnPos(sp);
    items.push({ y: p.y, draw(){
      shadow(p.x, p.y + 2, sp.spr.width * 0.38);
      drawSpr(sp.spr, p.x - sp.spr.width / 2, p.y - sp.spr.height + 5, {});
      if ((G.t >> 3) % 4 === 0){ drawText("!", p.x - 2, p.y - sp.spr.height - 6, "#ff5858"); }
    } });
  }
  if (G.roomId === "freezer"){
    for (const b of puzzleBlocks)
      items.push({ y: b.y + 6, draw(){
        shadow(b.x, b.y + 6, 6);
        drawSpr(iceBlockSpr, b.x - 8, b.y - 10, {});
        if (b.locked){ ctx.fillStyle = "rgba(255,200,106,0.25)"; ctx.fillRect(b.x - 8, b.y - 8, 16, 16); }
      } });
  }
  for (let i = G.party.length - 1; i >= 0; i--){
    const pos = partyMember(i), mem = G.party[i];
    items.push({ y: pos.y + (G.party.length - 1 - i) * 0.01, draw(){ drawCharSprite(mem, pos); } });
  }
  items.sort((a, b) => a.y - b.y).forEach(it => it.draw());
  ctx.restore();

  const roomDark = typeof room.dark === "function" ? room.dark() : room.dark;
  if (roomDark){
    const g = darkOverlay.getContext("2d");
    g.clearRect(0, 0, W, H);
    g.fillStyle = "rgba(8,12,42,0.55)"; g.fillRect(0, 0, W, H);
    g.globalCompositeOperation = "destination-out";
    const lx = player.x - G.cam.x, ly = player.y - G.cam.y - 8;
    const grad = g.createRadialGradient(lx, ly, 12, lx, ly, 85);
    grad.addColorStop(0, "rgba(0,0,0,0.9)"); grad.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = grad; g.beginPath(); g.arc(lx, ly, 85, 0, 7); g.fill();
    g.globalCompositeOperation = "source-over";
    ctx.drawImage(darkOverlay, 0, 0);
  }
  drawExitMarkers(room);

    ctx.globalAlpha = G.flash.a; ctx.fillStyle = G.flash.color; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
    G.flash.a -= 0.08; if (G.flash.a <= 0) G.flash = null;
  }
  drawFade();
  if (G.menu) drawWorldMenu();
  drawDialog();
}
// glowing markers so the player always knows where the next area is
function drawArrow(tx, ty, dx, dy, col){
  ctx.fillStyle = col;
  for (let i = 0; i < 4; i++){
    const s = i + 1;
    if (dx !== 0) ctx.fillRect(tx - dx * (2 + i * 2) - (dx > 0 ? 0 : 2), ty - s, 2, s * 2);
    else ctx.fillRect(tx - s, ty - dy * (2 + i * 2) - (dy > 0 ? 0 : 2), s * 2, 2);
  }
}
function drawExitMarkers(room){
  const col = "#6fe8ff";
  for (const ex of room.exits){
    const sx = Math.round(ex.x - G.cam.x), sy = Math.round(ex.y - G.cam.y);
    const cx = Math.round(sx + ex.w / 2), cy = Math.round(sy + ex.h / 2);
    if (cx < -24 || cx > W + 24 || cy < -24 || cy > H + 24) continue;
    const pulse = 0.5 + 0.3 * Math.sin(G.t / 16);
    const bob = Math.sin(G.t / 12) * 2;
    ctx.fillStyle = col;
    ctx.globalAlpha = pulse * 0.35;
    if (ex.dir === "up") ctx.fillRect(sx - 1, sy - 30, ex.w + 2, 30 + ex.h); // glow the doorway
    else ctx.fillRect(sx, sy, ex.w, ex.h);
    ctx.globalAlpha = pulse;
    if (ex.dir === "right") drawArrow(cx - 8 + bob, cy, 1, 0, col);
    else if (ex.dir === "left") drawArrow(cx + 8 - bob, cy, -1, 0, col);
    else if (ex.dir === "up") drawArrow(cx, sy - 34 - bob, 0, -1, col);
    else drawArrow(cx, cy + 2 + bob, 0, 1, col);
    ctx.globalAlpha = 1;
  }
}
function signPost(x, y){
  ctx.fillStyle = "#6a5432"; ctx.fillRect(x - 2, y - 8, 4, 10);
  ctx.fillStyle = "#8a7148"; ctx.fillRect(x - 8, y - 16, 16, 10);
  ctx.fillStyle = "#5c4a2e"; ctx.fillRect(x - 6, y - 14, 12, 2); ctx.fillRect(x - 6, y - 11, 12, 2);
}

// ---------------- overworld menu (C) ----------------
function updateWorldMenu(){
  const m = G.menu;
  if (m.view === "main"){
    if (pressed.x || pressed.c){ eat("x"); eat("c"); SFX.cancel(); G.menu = null; return; }
    if (pressed.up){ eat("up"); m.sel = (m.sel + 1) % 2; SFX.move(); }
    if (pressed.down){ eat("down"); m.sel = (m.sel + 1) % 2; SFX.move(); }
    if (pressed.z){
      eat("z");
      if (m.sel === 0){
        if (G.inv.length === 0){ SFX.cancel(); return; }
        SFX.confirm(); m.view = "items"; m.itemSel = 0;
      } else { SFX.cancel(); G.menu = null; }
    }
  } else if (m.view === "items"){
    if (pressed.x){ eat("x"); SFX.cancel(); m.view = "main"; return; }
    if (pressed.up){ eat("up"); m.itemSel = (m.itemSel + G.inv.length - 1) % G.inv.length; SFX.move(); }
    if (pressed.down){ eat("down"); m.itemSel = (m.itemSel + 1) % G.inv.length; SFX.move(); }
    if (pressed.z){ eat("z"); SFX.confirm(); m.view = "target"; m.target = 0; }
  } else if (m.view === "target"){
    const np = G.party.length;
    if (pressed.x){ eat("x"); SFX.cancel(); m.view = "items"; return; }
    if (pressed.up){ eat("up"); m.target = (m.target + np - 1) % np; SFX.move(); }
    if (pressed.down){ eat("down"); m.target = (m.target + 1) % np; SFX.move(); }
    if (pressed.z){
      eat("z");
      const id = G.inv[m.itemSel];
      const t = G.party[m.target];
      useItem(id, m.target);
      G.menu = null;
      const line = pick(ITEM_REACTIONS[t.id]).replace("{ITEM}", ITEMS[id].name);
      say([{ p: t.id, name: t.name, t: line }]);
    }
  }
}
function useItem(itemId, targetIdx){
  const it = ITEMS[itemId];
  if (!it) return;
  SFX.heal();
  if (it.healAll){
    G.party.forEach(p => p.hp = Math.min(p.maxhp, p.hp + it.healAll));
  } else {
    const t = G.party[targetIdx];
    t.hp = Math.min(t.maxhp, t.hp + it.heal);
  }
  if (it.tp) G.tp = clamp(G.tp + it.tp, 0, 100);
  G.inv.splice(G.inv.indexOf(itemId), 1);
}
function hpBar(x, y, w, hp, maxhp, col){
  ctx.fillStyle = "#3a3f52"; ctx.fillRect(x, y, w, 5);
  ctx.fillStyle = col || (hp / maxhp > 0.35 ? "#58c858" : "#e05858");
  ctx.fillRect(x, y, Math.max(0, Math.round(w * hp / maxhp)), 5);
}
function drawWorldMenu(){
  const m = G.menu;
  const np = G.party.length;
  drawBox(176, 8, 140, 44 + np * 26);
  G.party.forEach((p, i) => {
    const y = 16 + i * 26;
    drawText(p.name, 184, y, p.col);
    hpBar(184, y + 9, 84, p.hp, p.maxhp);
    drawText(`${p.hp}/${p.maxhp}`, 272, y + 8, "#c9c9d8");
  });
  const infoY = 20 + np * 26;
  drawText(`TP ${Math.round(G.tp)}%`, 184, infoY, "#f0a030");
  hpBar(230, infoY + 1, 54, G.tp, 100, "#f0a030");
  drawText(`CRUMBS ${G.crumbs}`, 184, infoY + 14, "#ffe14a");
  drawText(`LV ${G.lv}`, 282, infoY + 14, "#c9c9d8");
  const menuY = 58 + np * 26;
  drawBox(176, menuY, 140, 34);
  ["ITEMS", "CLOSE"].forEach((s, i) => {
    drawText(s, 198, menuY + 8 + i * 11, m.view === "main" && m.sel === i ? "#ffe14a" : "#c9c9d8");
    if (m.view === "main" && m.sel === i) ctx.drawImage(soulSpr, 188, menuY + 9 + i * 11);
  });
  if (m.view === "items" || m.view === "target"){
    drawBox(30, 8, 144, 24 + Math.max(1, G.inv.length) * 11);
    drawText("ITEMS", 40, 14, "#8a93a8");
    if (G.inv.length === 0) drawText("(EMPTY)", 40, 26, "#5a5f72");
    G.inv.forEach((id, i) => {
      drawText(ITEMS[id].name, 48, 26 + i * 11, m.view === "items" && m.itemSel === i ? "#ffe14a" : "#c9c9d8");
      if (m.itemSel === i) ctx.drawImage(soulSpr, 38, 27 + i * 11);
    });
    if (m.view === "items" && G.inv[m.itemSel])
      drawText(ITEMS[G.inv[m.itemSel]].desc, 12, H - 10, "#8a93a8");
  }
  if (m.view === "target"){
    drawBox(30, 140, 120, 18 + G.party.length * 10);
    drawText("USE ON:", 38, 146, "#8a93a8");
    G.party.forEach((p, i) => {
      drawText(p.name, 56, 156 + i * 10, m.target === i ? "#ffe14a" : "#c9c9d8");
      if (m.target === i) ctx.drawImage(soulSpr, 44, 157 + i * 10);
    });
  }
}

        : G.flags.ch2 ? pick(["THE DARK CON HUMS WITH STATIC!", "A CHALLENGER LOOMS BETWEEN THE BOOTHS!", "IT SMELLS LIKE ENERGY DRINKS AND MENACE."])
        : pick(["THE COLD AIR CRACKLES!", "SNACKS APPROACH WITH INTENT!", "IT SMELLS LIKE TROUBLE. AND FOOD."]);
  if (B.tutorial && !G.flags.tutSeen){

      { p:"bmo", name:"BMO", t:"AND DEFEND MEANS YOU TAKE THE HITS SO THE REST OF US DON'T. HALF DAMAGE. VERY HEROIC." }

}
function aliveEnemies(){ return B.enemies.filter(e => e.alive); }
function aliveParty(){ return G.party.filter(p => p.hp > 0); }
function nextChar(from){
  for (let i = from; i < G.party.length; i++) if (G.party[i].hp > 0) return i;
  return -1;
}
// battle panel geometry adapts to party size (3 or 4)
function panelGeom(){
  const n = G.party.length;
  return n >= 4 ? { x0: 8, gap: 78, w: 74 } : { x0: 12, gap: 100, w: 96 };
}
function panelCX(i){ const g = panelGeom(); return g.x0 + i * g.gap + g.w / 2; }
function battleWon(){ return B.enemies.every(e => !e.alive); }

function setState(s){ B.state = s; B.stateT = 0; B.menuSel = 0; B.subSel = 0; B.targetSel = 0; }

function queueMsg(m){ B.msgQueue.push(m); }
function popMsg(){
  if (B.msgQueue.length){ B.msg = B.msgQueue.shift(); return true; }
  return false;
}

// ---- damage / numbers ----
function dmgNum(x, y, s, col){ B.dmgNums.push({ x, y, t: 50, s: String(s), col: col || "#ffffff" }); }
function hurtEnemy(e, dmg){
  dmg = Math.max(1, Math.round(dmg) - e.def);
  e.hp -= dmg; e.shake = 16; e.flashT = 10; e.hpShow = 90;
  dmgNum(e.x, e.y - 10, dmg);
  SFX.hitEnemy();
  shake(4, 8);
  if (e.hp <= 0){
    e.hp = 0; e.alive = false; e.dying = 40; G.kills++;
    B.rewardExp += e.exp; B.rewardCrumbs += e.crumbs;
    queueMsg(e.killText);
    SFX.boom();
  }
  if (e.defId === "glacion") checkBossPhase(e);
  if (e.defId === "chips") checkChipsPhase(e);
  if (e.defId === "ballpit") checkBallpitPhase(e);
  if (e.defId === "rolly") checkRollyPhase(e);
  if (e.defId === "gator") checkGatorPhase(e);
  if (e.defId === "doughmer") checkDoughmerPhase(e);
  if (e.defId === "mcronald") checkMcronaldPhase(e);
}
function checkChipsPhase(e){
  if (!e.phase2 && e.alive && e.hp <= e.maxhp / 2){
    e.phase2 = true;
    B.bossDlgQueue.push([
      { t:'A DISTANT, MUFFLED VOICE FROM SOMEWHERE FAR ABOVE: "HAND ME A BAG OF THEM POTATO CHIPS."' },
      { t:"THE WHOLE FRIDGE TREMBLES. CRISPUS FREEZES MID-CRINKLE." },
      { p:"bmo", name:"BMO", t:"UH OH. SOMEONE UPSTAIRS JUST ROLLED FOR LOOT. AND CRISPUS IS THE DROP." },
      { t:"CRISPUS: NO!! NOT LIKE THIS!! I ONLY JUST FIGURED OUT WHERE I LIVE!!" }
    ]);
  }
}
function checkBossPhase(e){
  const frac = e.hp / e.maxhp;
  if (B.bossPhase === 1 && frac <= 0.66 && e.alive){
    B.bossPhase = 2;
    B.bossDlgQueue.push([
      { p:"glacion", name:"KING GLACION", t:"YOU CHIP AT ME? I HAVE ENDURED A THOUSAND DEFROST CYCLES." },
      { p:"glacion", name:"KING GLACION", t:"COLD PRESERVES. COLD PROTECTS. COLD... KEEPS THINGS FROM LEAVING." }
    ]);
  }
  if (B.bossPhase === 2 && frac <= 0.33 && e.alive){
    B.bossPhase = 3;
    B.bossDlgQueue.push([
      { p:"glacion", name:"KING GLACION", t:"ENOUGH!! DO YOU KNOW WHY I HOARD THE WARM THINGS?!" },
      { p:"glacion", name:"KING GLACION", t:"EVERYTHING WARM I EVER LOVED... WENT OUT THAT DOOR AND NEVER CAME BACK." },
      { p:"bmo", name:"BMO", t:"...DUDE. THAT'S JUST HOW EATING WORKS." },
      { p:"glacion", name:"KING GLACION", t:"IT IS A FLAWED SYSTEM AND I REJECT IT!!" }
    ]);
  }
}
function shake(mag, dur){ G.shakeMag = mag; G.shake = dur; }

// ---- battle update ----
function updateBattle(){
  B.stateT++;
  if (G.shake > 0) G.shake--;
  B.dmgNums.forEach(d => { d.t--; d.y -= 0.4; });
  B.dmgNums = B.dmgNums.filter(d => d.t > 0);
  B.fx.forEach(f => { f.t--; f.x += f.vx || 0; f.y += f.vy || 0; });
  B.fx = B.fx.filter(f => f.t > 0);
  B.enemies.forEach(e => {
    if (e.shake > 0) e.shake--;
    if (e.flashT > 0) e.flashT--;
    if (e.hpShow > 0) e.hpShow--;
    if (!e.alive && e.dying > 0) e.dying--;
  });

  if (G.dialog){ updateDialog(); return; }

  switch (B.state){
    case "intro":
      if (B.stateT > 40) setState("menu");
      break;
    case "menu": updateBattleMenu(); break;
    case "target": updateTargetSel(); break;
    case "list": updateListSel(); break;
    case "fightbar": updateFightBar(); break;
    case "msg":
      if ((B.stateT > 20 && pressed.z) || (!B.msg && B.stateT > 30)){
        eat("z");
        if (!popMsg()) advanceTurnFlow();
        else B.stateT = 0;
      }
      break;
    case "edlg":
      if (B.stateT > 80 || (B.stateT > 15 && pressed.z)){ eat("z"); startBullets(); }
      break;
    case "bullets": updateBullets(); break;
    case "victory":
      if (B.stateT > 20 && pressed.z){ eat("z"); finishBattle(true); }
      break;
    case "spareEnd":
      if (B.stateT > 20 && pressed.z){ eat("z"); finishBattle(true); }
      break;
    case "fled":
      if (B.stateT > 20 && pressed.z){ eat("z"); finishBattle(false); }
      break;
  }
}
const COMMANDS = ["FIGHT", "ACT", "MAGIC", "ITEM", "SPARE", "DEFEND"];
function updateBattleMenu(){
  if (pressed.left){ eat("left"); B.menuSel = (B.menuSel + 5) % 6; SFX.move(); }
  if (pressed.right){ eat("right"); B.menuSel = (B.menuSel + 1) % 6; SFX.move(); }
  if (pressed.z){
    eat("z"); SFX.confirm();
    const cmd = COMMANDS[B.menuSel];
    if (cmd === "FIGHT" || cmd === "ACT" || cmd === "SPARE"){
      B.listKind = cmd; setState("target"); B.state = "target";
    } else if (cmd === "MAGIC"){
      B.listKind = "MAGIC"; setState("list");
    } else if (cmd === "ITEM"){
      if (!G.inv.length){ B.msg = "YOUR POCKETS CONTAIN ONLY HOPE."; return; }
      B.listKind = "ITEM"; setState("list");
    } else if (cmd === "DEFEND"){
      B.defend[B.ci] = true;
      G.tp = clamp(G.tp + 16, 0, 100);
      B.msg = `${G.party[B.ci].name} GUARDS THE PARTY! TP UP!`;
      SFX.tp();
      endCharAction();
    }
  }
}
function targetList(){
  const arr = aliveEnemies().map(e => ({ e, label: e.name }));
  if (B.listKind === "SPARE" && B.canFlee) arr.push({ flee: true, label: "FLEE" });
  return arr;
}
function updateTargetSel(){
  const list = targetList();
  if (pressed.x){
    eat("x"); SFX.cancel();
    if (B.listKind === "SPELLT" && B.pendingSpell) G.tp = clamp(G.tp + B.pendingSpell.cost, 0, 100);
    setState("menu"); return;
  }
  if (pressed.up || pressed.left){ eat("up"); eat("left"); B.targetSel = (B.targetSel + list.length - 1) % list.length; SFX.move(); }
  if (pressed.down || pressed.right){ eat("down"); eat("right"); B.targetSel = (B.targetSel + 1) % list.length; SFX.move(); }
  if (pressed.z){
    eat("z"); SFX.confirm();
    const t = list[B.targetSel];
    if (t.flee){
      B.msg = pick(["YOU FLED. THE SNACKS JUDGE YOU SILENTLY.", "YOU RAN AWAY, DRAMATICALLY. NAILED IT."]);
      setState("fled"); return;
    }
    if (B.listKind === "FIGHT"){
      B.fightTargets = [t.e]; B.fightX = B.box.x - 10; B.fightDone = false; setState("fightbar");
    } else if (B.listKind === "ACT"){
      B.actEnemy = t.e; setState("list"); B.listKind = "ACT2";
    } else if (B.listKind === "SPARE"){
      doSpare(t.e);
    } else if (B.listKind === "SPELLT"){
      resolveAtkSpell(B.pendingSpell, t.e);
    }
  }
}
function listItems(){
  if (B.listKind === "MAGIC") return SPELLS[G.party[B.ci].id].map(s => ({ s, label: `${s.name} ${s.cost}TP` }));
  if (B.listKind === "ITEM") return G.inv.map((id, i) => ({ item: id, idx: i, label: ITEMS[id].name }));
  if (B.listKind === "ACT2"){
    const acts = [{ t:"CHECK", check:true }, ...B.actEnemy.acts];
    return acts.map(a => ({ a, label: a.t }));
  }
  if (B.listKind === "ALLY" || B.listKind === "HEALALLY") return G.party.map((p, i) => ({ ally: i, label: p.name + (p.hp <= 0 ? " (DOWN)" : "") }));
  return [];
}
function updateListSel(){
  const list = listItems();
  if (!list.length){ setState("menu"); return; }
  if (pressed.x){
    eat("x"); SFX.cancel();
    if (B.listKind === "HEALALLY") G.tp = clamp(G.tp + (B.healCost || 0), 0, 100);
    setState(B.listKind === "ACT2" ? "target" : "menu");
    if (B.state === "target") B.listKind = "ACT";
    return;
  }
  if (pressed.up){ eat("up"); B.subSel = (B.subSel + list.length - 1) % list.length; SFX.move(); }
  if (pressed.down){ eat("down"); B.subSel = (B.subSel + 1) % list.length; SFX.move(); }
  if (B.subSel >= list.length) B.subSel = 0;
  if (pressed.z){
    eat("z");
    const sel = list[B.subSel];
    if (B.listKind === "MAGIC"){
      const sp = sel.s;
      if (G.tp < sp.cost){ SFX.cancel(); B.msg = "NOT ENOUGH TP! GRAZE BULLETS OR DEFEND TO CHARGE."; return; }
      SFX.confirm();
      castSpell(sp);
    } else if (B.listKind === "ITEM"){
      SFX.confirm();
      B.useItemIdx = sel.idx; B.listKind = "ALLY"; B.subSel = 0;
    } else if (B.listKind === "ALLY"){
      SFX.confirm();
      const id = G.inv[B.useItemIdx];
      const target = G.party[sel.ally];
      const wasDown = target.hp <= 0;
      useItem(id, sel.ally);
      B.msg = `${target.name} ${wasDown ? "GOT BACK UP!" : "FEELS RESTORED!"} (${ITEMS[id].name})`;
      dmgNum(panelCX(sel.ally), 180, "+" + (ITEMS[id].heal || ITEMS[id].healAll), "#58e858");
      endCharAction();
    } else if (B.listKind === "HEALALLY"){
      SFX.heal();
      const target = G.party[sel.ally];
      const wasDown = target.hp <= 0;
      target.hp = Math.min(target.maxhp, target.hp + B.healPow);
      B.msg = `BMO BEAMS HEALING PIXELS! ${target.name} ${wasDown ? "GOT BACK UP WITH" : "RECOVERED"} ${B.healPow} HP!`;
      dmgNum(panelCX(sel.ally), 178, "+" + B.healPow, "#58e858");
      endCharAction();
    } else if (B.listKind === "ACT2"){
      SFX.confirm();
      const e = B.actEnemy;
      if (sel.a.check) B.msg = e.check;
      else B.msg = sel.a.fn(e);
      if (e.spareable) SFX.spare();
      endCharAction();
    }
  }
}
function castSpell(sp){
  const c = G.party[B.ci];
  G.tp -= sp.cost;
  if (sp.kind === "heal"){ B.healPow = sp.pow; B.healCost = sp.cost; B.listKind = "HEALALLY"; setState("list"); return; }
  if (sp.kind === "slow"){
    B.slowNext = 0.55;
    SFX.heal();
    B.msg = "BMO SINGS A LULLABYTE. THE AIR GETS DROWSY. BULLETS WILL BE SLEEPY.";
    endCharAction(); return;
  }
  if (sp.kind === "allatk"){
    SFX.spell();
    aliveEnemies().forEach(e => hurtEnemy(e, (c.atk + G.lv * 2) * sp.pow));
    spellFx(c.id === "bob" ? "#5878e0" : "#8ecf5e");
    B.msg = c.id === "bob"
      ? "BOB DETONATES MAGNIFICENTLY! EVERYTHING IS HIT! HE'S FINE! HE'S ALWAYS FINE!"
      : "DORKO SPINS LIKE A DESTINY FRISBEE! IT HITS EVERYONE!";
    endCharAction(); return;
  }
  if (sp.kind === "atk"){
    const targets = aliveEnemies();
    if (targets.length > 1){ B.pendingSpell = sp; B.listKind = "SPELLT"; setState("target"); return; }
    resolveAtkSpell(sp, targets[0]); return;
  }
}
function setStateKeep(s){ B.state = s; B.stateT = 0; B.targetSel = 0; }
function resolveAtkSpell(sp, e){
  const c = G.party[B.ci];
  SFX.spell();
  hurtEnemy(e, (c.atk + G.lv * 2) * sp.pow);
  e.atk = Math.max(1, e.atk - 2);
  spellFx("#5ea8e8");
  B.msg = "MEGAFIRE'S BLUE FLAME ROARS! IT'S COLD AND HOT AT ONCE! ENEMY ATTACK FELL!";
  endCharAction();
}
function spellFx(col){
  for (let i = 0; i < 24; i++)
    B.fx.push({ x:160 + rnd(-60, 60), y:44 + rnd(-20, 20), vx:rnd(-1, 1), vy:rnd(-1.5, 0.5), t:irnd(15, 35), col, kind:"spark" });
}
function doSpare(e){
  if (e.spareable){
    e.spared = true; e.alive = false; e.dying = 40; G.spares++;
    B.rewardCrumbs += e.crumbs + 10;
    SFX.spare();
    for (let i = 0; i < 16; i++)
      B.fx.push({ x:e.x + rnd(-16, 16), y:e.y + rnd(-16, 16), vx:rnd(-0.5, 0.5), vy:rnd(-1.2, -0.2), t:irnd(20, 40), col:"#ffe14a", kind:"spark" });
    B.msg = e.spareText;
    if (e.defId === "kongy"){
      if (G.inv.length < 8) G.inv.push("cheese");
      else B.msg = "KONGY OFFERS A CHEESE WHEEL, BUT YOUR POCKETS ARE FULL. HE NODS. THE RESPECT REMAINS.";
    }
    if (e.defId === "chips"){
      if (G.inv.length < 8) G.inv.push("chip");
      else B.msg = "CRISPUS OFFERS ONE PERFECT CHIP, BUT YOUR POCKETS ARE FULL. HE UNDERSTANDS. STORAGE IS COMPLICATED.";
    }
  } else {
    B.msg = e.mercy > 0 || e.soft || e.sniffed
      ? `${e.name} IS ALMOST THERE. KEEP AT IT!`
      : `${e.name} ISN'T READY TO STOP. (TRY ACTING FIRST)`;
  }
  endCharAction();
}

// ---- fight minigame ----
function updateFightBar(){
  const left = B.box.x - 10, right = B.box.x + B.box.w + 10;
  B.fightX += 2.6;
  if (pressed.z && !B.fightDone){
    eat("z");
    B.fightDone = true;
    const center = (left + right) / 2;
    const off = Math.abs(B.fightX - center);
    const c = G.party[B.ci];
    let mult, label = null;
    if (off < 7){ mult = 2.3; label = "CRIT!!"; SFX.levelup(); }
    else { mult = Math.max(0.35, 1.9 - off / 55); SFX.slash(); }
    const e = B.fightTargets[0];
    slashFx(e);
    hurtEnemy(e, (c.atk + G.lv * 2 + irnd(0, 3)) * mult);
    if (label) dmgNum(e.x, e.y - 22, label, "#ffe14a");
    B.msg = "";
    setTimeoutState();
    return;
  }
  if (B.fightX > right + 10 && !B.fightDone){
    B.fightDone = true;
    SFX.miss();
    B.msg = `${G.party[B.ci].name} WHIFFS COMPLETELY. THE AIR IS UNHARMED.`;
    dmgNum(B.fightTargets[0].x, B.fightTargets[0].y - 10, "MISS", "#8a93a8");
    setTimeoutState();
  }
}
function setTimeoutState(){ endCharAction(); }
function slashFx(e){
  for (let i = 0; i < 3; i++)
    B.fx.push({ x:e.x - 12 + i * 4, y:e.y - 14 + i * 9, vx:2.5, vy:0.6, t:12 + i * 3, col:"#ffffff", kind:"slash" });
}

// ---- turn flow ----
function endCharAction(){
  // after a character acts: message state, then next char or enemy turn
  if (battleWon()){
    setState("msg");
    if (!B.msg) popMsg();
    B.afterMsg = "end";
    return;
  }
  setState("msg");
  if (!B.msg) popMsg();
  B.afterMsg = "next";
}
function advanceTurnFlow(){
  if (B.afterMsg === "end" || battleWon()){ startVictory(); return; }
  if (B.afterMsg === "bobdone"){ B.afterMsg = ""; startEnemyTurn(); return; }
  const ni = nextChar(B.ci + 1);
  if (ni === -1){ startEnemyTurn(); }
  else { B.ci = ni; setState("menu"); B.msg = defaultMsg(); }
}
function defaultMsg(){
  const e = aliveEnemies()[0];
  if (!e) return "";
  if (B.groupId === "boss") return "GLACION'S COLD GAZE SETTLES ON YOU.";
  return pick([
    `${e.name} ${e.defId === "kongy" ? "FLEXES MAGNIFICENTLY." : "SHUFFLES MENACINGLY."}`,
    `THE AIR SMELLS LIKE ${e.defId === "gherkin" ? "VINEGAR" : e.defId === "eggbert" ? "BREAKFAST" : e.defId === "onion" ? "TEARS" : e.defId === "chips" ? "NACHO-SCENTED DESPAIR" : "CHEESE"}.`,
    `${e.name} EYES THE PARTY.`,
    e.spareable ? `${e.name} IS READY TO BE SPARED!` : `${e.name} HOLDS ITS GROUND.`
  ]);
}
function startVictory(){
  playJingle("victory");
  const allSpared = B.enemies.every(e => e.spared);
  let m = allSpared ? "PEACE ACHIEVED! " : "YOU WON! ";
  m += `GOT ${B.rewardCrumbs} CRUMBS`;
  G.crumbs += B.rewardCrumbs;
  if (B.rewardExp > 0){
    G.exp += B.rewardExp;
    m += ` AND ${B.rewardExp} EXP`;
  }
  m += "!";
  while (G.exp >= G.lv * 40){
    G.exp -= G.lv * 40; G.lv++;
    G.party.forEach(p => { p.atk += 2; p.maxhp += 8; p.hp = Math.min(p.maxhp, p.hp + 20); });
    m += ` LV UP! NOW LV ${G.lv}!`;
    SFX.levelup();
  }
  B.msg = m;
  setState("victory");
}
function startEnemyTurn(){
  // Bob fights alongside the party against the gator: one blast per round
  if (B.groupId === "gatorFight" && B.bobTurn !== B.turn){
    B.bobTurn = B.turn;
    const e = aliveEnemies()[0];
    if (e){
      SFX.boom(); shake(4, 10);
      hurtEnemy(e, 22 + e.def);
      if (battleWon()){ setState("msg"); B.msg = "BOB LOBS HIMSELF AT SNAPJAW AND DETONATES!!"; B.afterMsg = "end"; return; }
      B.msg = "BOB LOBS HIMSELF AT SNAPJAW AND DETONATES!! HE REASSEMBLES INSTANTLY, DELIGHTED.";
      setState("msg");
      B.afterMsg = "bobdone";
      return;
    }
  }
  // boss scripted dialogue first if queued (drain fully, in order)
  if (B.bossDlgQueue.length){
    const script = B.bossDlgQueue.shift();
    say(script, () => { startEnemyTurn(); });
    return;
  }
  enemyBubble();
}

      1: ["ROLLS. GIVE. NOW.", "I CAN SMELL THE MARINARA FROM HERE.", "*ENORMOUS JAW SOUNDS*"],
      2: ["I'VE EATEN A LADDER. YOU THINK I FEAR YOU?", "THE SEWER PROVIDES. SLOWLY. COLDLY.", "GIVE. THE. ROLLS."],
      3: ["ONE WARM THING. THAT'S ALL I WANTED.", "EVERYTHING DOWN HERE IS ALREADY EATEN...", "...IS THAT BELLY RUB STILL ON THE TABLE?"]
    }[B.bossPhase];
    B.bubble = { text: lines[B.turn % lines.length], e };
  } else if (e.defId === "rolly"){
    const lines = {
      1: ["HAVE YOU TRIED OUR NEW RANCH VARIANT?", "SMILES ARE MANDATORY. MINE IS PAINTED ON.", "BRAND LOYALTY IS FOREVER."],
      2: ["PLEASE ENJOY RESPONSIBLY.", "THE ROLL PROVIDES. THE ROLL PROVIDES.", "SYNERGY. SYNERGY. SYNERGY."],
      3: ["...WATER...", "...OVERTIME ISN'T REAL IF YOU LOVE YOUR JOB...", "...HELP..."]
    }[B.bossPhase];
    B.bubble = { text: lines[B.turn % lines.length], e };
  } else if (e.defId === "chips"){
    B.bubble = { text: pick(e.phase2 ? CHIPS_PANIC_QUOTES : e.quotes), e };
  } else {
    B.bubble = { text: pick(e.quotes), e };
  }
  setState("edlg");
  SFX.blip2();
}
function startBullets(){
  B.bubble = null;
  B.bullets = [];
  B.soul.x = B.box.x + B.box.w / 2; B.soul.y = B.box.y + B.box.h / 2; B.soul.inv = 0;
  B.phaseT = 0;
  B.phaseLen = ["boss", "ballpitFight", "rollyFight", "gatorFight", "doughmerFight", "mcronaldFight"].includes(B.groupId) ? 430 + B.bossPhase * 30 : B.groupId === "secret" ? 430 : 380;
  B.curSlow = B.slowNext; B.slowNext = 1;
  B.tutHintT = B.tutorial ? 240 : 0;
  setState("bullets");
}
function endBullets(){
  B.bullets = [];
  B.turn++;
  B.defend = new Array(G.party.length).fill(false);
  B.ci = nextChar(0);
  setState("menu");
  B.msg = defaultMsg();
}

// ---- bullet patterns ----
function spawnBullet(b){ b.grazed = false; b.t = 0; B.bullets.push(b); }
function updateBullets(){
  B.phaseT++;
  const sp = held.x ? 0.85 : 1.75;
  const s = B.soul;
  if (held.left) s.x -= sp; if (held.right) s.x += sp;
  if (held.up) s.y -= sp; if (held.down) s.y += sp;
  s.x = clamp(s.x, B.box.x + 5, B.box.x + B.box.w - 5);
  s.y = clamp(s.y, B.box.y + 5, B.box.y + B.box.h - 5);
  if (s.inv > 0) s.inv--;

  // spawners
  for (const e of aliveEnemies()) runPattern(e);

  const slow = B.curSlow;
  for (const b of B.bullets){
    b.t++;
    if (b.kind === "homing"){
      const d = Math.hypot(s.x - b.x, s.y - b.y) || 1;
      b.vx += (s.x - b.x) / d * 0.05; b.vy += (s.y - b.y) / d * 0.05;
      const v = Math.hypot(b.vx, b.vy);
      if (v > 1.6){ b.vx = b.vx / v * 1.6; b.vy = b.vy / v * 1.6; }
    }
    const stut = b.kind === "lag" ? (b.t % 9 < 3 ? 3 : 0) : 1; // laggy bullets teleport-step
    b.x += b.vx * slow * stut; b.y += b.vy * slow * stut;
    if (b.kind === "bounce"){
      if (b.x < B.box.x + b.r || b.x > B.box.x + B.box.w - b.r){ b.vx *= -1; b.x = clamp(b.x, B.box.x + b.r, B.box.x + B.box.w - b.r); }
      if (b.y < B.box.y + b.r || b.y > B.box.y + B.box.h - b.r){ b.vy *= -1; b.y = clamp(b.y, B.box.y + b.r, B.box.y + B.box.h - b.r); }
    }
    // graze + hit (short spawn grace so emitter-adjacent spawns can't cheap-shot or farm TP)
    const d = Math.hypot(s.x - b.x, s.y - b.y);
    if (b.t >= 8 && d < b.r + 3){
      if (s.inv <= 0){
        s.inv = 60;
        const dmg = b.dmg + irnd(0, 2);
        applyPartyDamage(dmg);
      }
    } else if (b.t >= 6 && d < b.r + 12 && !b.grazed){
      b.grazed = true;
      G.tp = clamp(G.tp + 2.5, 0, 100);
      SFX.graze();
      B.fx.push({ x: s.x + rnd(-4, 4), y: s.y + rnd(-4, 4), vx:0, vy:-0.8, t:14, col:"#ffe14a", kind:"spark" });
    }
  }
  B.bullets = B.bullets.filter(b =>
    b.t < (b.life || 900) &&
    b.x > B.box.x - 30 && b.x < B.box.x + B.box.w + 30 &&
    b.y > B.box.y - 30 && b.y < B.box.y + B.box.h + 30
  );
  if (aliveParty().length === 0){ startGameOver(); return; }
  if (B.phaseT >= B.phaseLen) endBullets();
}
function applyPartyDamage(dmg){
  let idx = B.defend.findIndex((d, i) => d && G.party[i].hp > 0);
  let mult = 1;
  if (idx >= 0) mult = 0.5;
  else {
    const alive = G.party.map((p, i) => i).filter(i => G.party[i].hp > 0);
    idx = pick(alive);
  }
  const p = G.party[idx];
  const final = Math.max(1, Math.round(dmg * mult));
  p.hp = Math.max(0, p.hp - final);
  dmgNum(panelCX(idx), 178, final, "#ff5858");
  SFX.hurt();
  shake(5, 10);
  G.flash = { color: "rgba(255,60,60,0.35)", a: 0.5 };
  if (p.hp <= 0) dmgNum(panelCX(idx), 188, "DOWN!", "#ff5858");
}
function runPattern(e){
  const t = B.phaseT, box = B.box;
  const pat = e.pattern === "boss" ? null : e.pattern;
  const BOSS_GROUPS = ["boss", "ballpitFight", "rollyFight", "gatorFight", "doughmerFight", "mcronaldFight"];
  const spdMul = (e.soft ? 0.75 : 1) * (BOSS_GROUPS.includes(B.groupId) ? 1 + (B.bossPhase - 1) * 0.18 : 1);
  if (e.pattern === "boss"){ bossPattern(e, t, spdMul); return; }
  if (e.pattern === "ballpit"){ ballpitPattern(e, t, spdMul); return; }
  if (e.pattern === "rolly"){ rollyPattern(e, t, spdMul); return; }
  if (EXTRA_PATTERNS[e.pattern]){ EXTRA_PATTERNS[e.pattern](e, t, spdMul, box); return; }
  if (pat === "aimed"){
    if (t % 46 === 8){
      aimShot(e, box, 2.1 * spdMul, "#8ecf5e", "pickle", 4);
      if (e.maxhp - e.hp > 20){ aimShot(e, box, 2.1 * spdMul, "#8ecf5e", "pickle", 4, 0.35); aimShot(e, box, 2.1 * spdMul, "#8ecf5e", "pickle", 4, -0.35); }
    }
  } else if (pat === "waves"){
    if (t % 34 === 10){
      const gap = (Math.sin(t * 0.02 + e.seed) * 0.5 + 0.5) * (box.w - 40) + box.x + 20;
      for (let x = box.x + 8; x < box.x + box.w - 4; x += 22){
        if (Math.abs(x - gap) < 20) continue;
        spawnBullet({ x, y: box.y + 4, vx: Math.sin((x + t) * 0.1) * 0.3, vy: 1.25 * spdMul, r: 4, dmg: e.atk, col:"#f2ede2", kind:"egg" });
      }
    }
  } else if (pat === "spiral"){
    if (t % 11 === 0){
      const a = t * 0.19 + e.seed;
      for (let k = 0; k < 2; k++){
        const ang = a + k * Math.PI;
        spawnBullet({ x: box.x + box.w / 2, y: box.y + box.h / 2 - 14,
          vx: Math.cos(ang) * 1.3 * spdMul, vy: Math.sin(ang) * 1.3 * spdMul,
          r: 4, dmg: e.atk, col:"#e8c99a", kind:"ring" });
      }
    }
  } else if (pat === "chips"){
    const m = (e.phase2 ? 1.3 : 1) * spdMul;
    if (t % 42 === 8){
      aimShot(e, box, 2.2 * m, "#e8a030", "chip", 4);
      aimShot(e, box, 2.2 * m, "#e8a030", "chip", 4, 0.4);
      aimShot(e, box, 2.2 * m, "#e8a030", "chip", 4, -0.4);
    }
    if (t % 36 === 20){
      const gap = (Math.sin(t * 0.023 + e.seed) * 0.5 + 0.5) * (box.w - 44) + box.x + 22;
      for (let x = box.x + 8; x < box.x + box.w - 4; x += 20)
        if (Math.abs(x - gap) >= 18)
          spawnBullet({ x, y: box.y + 4, vx: 0, vy: 1.35 * m, r: 3, dmg: e.atk, col:"#f8e8c8", kind:"shard" });
    }
    if (e.phase2 && t % 14 === 0){
      const a = t * 0.17;
      spawnBullet({ x: box.x + box.w / 2, y: box.y + box.h / 2 - 12,
        vx: Math.cos(a) * 1.4 * spdMul, vy: Math.sin(a) * 1.4 * spdMul, r: 4, dmg: e.atk, col:"#e8a030", kind:"chip" });
    }
  } else if (pat === "capsules"){
    const count = B.bullets.filter(b => b.kind === "bounce").length;
    if (t % 64 === 16 && count < 4){
      const ang = rnd(0.5, 1.2) + pick([0, Math.PI / 2, Math.PI, -Math.PI / 2]);
      spawnBullet({ x: box.x + box.w / 2 + rnd(-30, 30), y: box.y + 10,
        vx: Math.cos(ang) * 1.6 * spdMul, vy: Math.abs(Math.sin(ang)) * 1.6 * spdMul + 0.4,
        r: 5, dmg: e.atk, col: pick(["#e05858", "#58a0e0", "#ffe14a", "#58c858"]), kind:"bounce", life: 300 });
    }
    if (t % 50 === 30) aimShot(e, box, 1.9 * spdMul, "#c8e8f8", "ball", 4);
  } else if (pat === "lag"){
    if (t % 38 === 8){
      aimShot(e, box, 2.6 * spdMul, "#e040c0", "lag", 4);
      if (e.maxhp - e.hp > 25) aimShot(e, box, 2.6 * spdMul, "#40e0d0", "lag", 4, 0.5);
    }
  } else if (pat === "bounce"){
    const count = B.bullets.filter(b => b.kind === "bounce").length;
    if (t % 70 === 20 && count < 4){
      const ang = rnd(0.5, 1.2) + pick([0, Math.PI / 2, Math.PI, -Math.PI / 2]);
      spawnBullet({ x: box.x + box.w / 2 + rnd(-30, 30), y: box.y + 10,
        vx: Math.cos(ang) * 1.7 * spdMul, vy: Math.abs(Math.sin(ang)) * 1.7 * spdMul + 0.4,
        r: 6, dmg: e.atk + 1, col:"#e8c25c", kind:"bounce", life: 320 });
    }
  }
}
function aimShot(e, box, spd, col, kind, r, angOff = 0){
  const sx = clamp(e.x, box.x + 10, box.x + box.w - 10), sy = box.y + 6;
  const a = Math.atan2(B.soul.y - sy, B.soul.x - sx) + angOff;
  spawnBullet({ x: sx, y: sy, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r, dmg: e.atk, col, kind });
}
function bossPattern(e, t, spdMul){
  const box = B.box, ph = B.bossPhase;
  if (ph >= 1){
    if (t % (ph === 1 ? 40 : 55) === 6) aimShot(e, box, 2.2 * spdMul, "#9fd8f0", "shard", 4);
    if (ph === 1 && t % 44 === 22){
      const gap = (Math.sin(t * 0.017) * 0.5 + 0.5) * (box.w - 44) + box.x + 22;
      for (let x = box.x + 10; x < box.x + box.w - 4; x += 24)
        if (Math.abs(x - gap) >= 20)
          spawnBullet({ x, y: box.y + 4, vx: 0, vy: 1.3 * spdMul, r: 4, dmg: e.atk, col:"#d8f0ff", kind:"shard" });
    }
  }
  if (ph >= 2){
    if (t % 13 === 0){
      const a = t * 0.16;
      spawnBullet({ x: box.x + box.w / 2, y: box.y + box.h / 2 - 10,
        vx: Math.cos(a) * 1.35 * spdMul, vy: Math.sin(a) * 1.35 * spdMul, r: 4, dmg: e.atk, col:"#9fd8f0", kind:"ring" });
    }
    if (t % 95 === 40 && B.bullets.filter(b => b.kind === "bounce").length < 3)
      spawnBullet({ x: box.x + 20, y: box.y + 12, vx: 1.6 * spdMul, vy: 1.4 * spdMul, r: 6, dmg: e.atk + 1, col:"#7fb0e0", kind:"bounce", life: 300 });
  }
  if (ph >= 3){
    if (t % 120 === 60)
      spawnBullet({ x: box.x + (t % 240 === 60 ? 8 : box.w - 8), y: box.y + 8, vx: 0.5, vy: 0.5, r: 5, dmg: e.atk + 2, col:"#e0f4ff", kind:"homing", life: 260 });
    if (t % 44 === 22){
      const gap = (Math.cos(t * 0.021) * 0.5 + 0.5) * (box.w - 44) + box.x + 22;
      for (let x = box.x + 10; x < box.x + box.w - 4; x += 24)
        if (Math.abs(x - gap) >= 18)
          spawnBullet({ x, y: box.y + 4, vx: 0, vy: 1.45 * spdMul, r: 4, dmg: e.atk, col:"#d8f0ff", kind:"shard" });
    }
  }
}

// ---- battle end ----
function finishBattle(won){
  const gid = B.groupId;
  const allSpared = B.enemies.every(e => e.spared);
  const flag = B.flag;
  if (won && flag) G.flags[flag] = true;
  if (won && gid === "boss"){ G.flags.bossDone = true; G.flags.bossSpared = allSpared; }
  if (won && gid === "ballpitFight"){ G.flags.ballpitDone = true; G.flags.ballpitSpared = allSpared; }
  if (won && gid === "rollyFight"){ G.flags.rollyDone = true; G.flags.rollySpared = allSpared; }
  if (won && gid === "gatorFight"){ G.flags.gatorDone = true; G.flags.gatorSpared = allSpared; }
  if (won && gid === "doughmerFight"){ G.flags.doughmerDone = true; G.flags.doughmerSpared = allSpared; }
  if (won && gid === "mcronaldFight"){ G.flags.mcronaldDone = true; G.flags.mcronaldSpared = allSpared; }
  if (won && gid === "kongyFight") G.flags.kongySpared = allSpared;
  if (won && gid === "secret") G.flags.secretSpared = allSpared;
  if (won && gid === "comics") G.flags.comicsSpared = allSpared;
  B = null;
  G.mode = "world";
  G.invuln = 100;
  G.party.forEach(p => { if (p.hp <= 0) p.hp = 1; });
  playMusic(ROOMS[G.roomId].music);
  const postMap = {
    boss:         { script: () => postBossScript(),    done: () => G.flags.gotRolls },
    ballpitFight: { script: () => postBallpitScript(), done: () => G.flags.ch2Done },
    comics:       { script: () => postComicsScript(),  done: () => G.flags.boardroomOpen },
    rollyFight:   { script: () => postRollyScript(),   done: () => G.flags.ch3Done },
    gatorFight:   { script: () => postGatorScript(),   done: () => G.flags.ch4Done },
    doughmerFight:{ script: () => postDoughmerScript(),done: () => G.flags.ch5Done },
    mcronaldFight:{ script: () => postMcronaldScript(),done: () => G.flags.wacRelit }
  };
  const pm = postMap[gid];
  if (won && pm){
    const tryPost = () => {
      if (pm.done() || G.mode === "title" || G.mode === "end" || G.mode === "gameover") return;
      if (G.mode === "world" && !G.dialog && !G.menu){ say(pm.script()); return; }
      setTimeout(tryPost, 300);
    };
    setTimeout(tryPost, 400);
  }
}

// ---- battle render ----
function drawBattle(){
  ctx.save();
  if (G.shake > 0) ctx.translate(irnd(-G.shakeMag, G.shakeMag), irnd(-G.shakeMag, G.shakeMag));
  // background
  const boss = B.groupId === "boss";
  const grd = ctx.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, boss ? "#101a38" : "#181428");
  grd.addColorStop(1, "#060810");
  ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H);
  // slow-drifting diamond field (Deltarune dark-world flavor)
  ctx.fillStyle = boss ? "#1a2a52" : "#241e3e";
  const driftX = (G.t * 0.22) % 28, driftY = (G.t * 0.11) % 28;
  for (let y = -28; y < H + 28; y += 28)
    for (let x = -28; x < W + 28; x += 28){
      const px2 = x + driftX, py2 = y + driftY;
      ctx.beginPath();
      ctx.moveTo(px2, py2 - 5); ctx.lineTo(px2 + 5, py2); ctx.lineTo(px2, py2 + 5); ctx.lineTo(px2 - 5, py2);
      ctx.fill();
    }

  // enemies
  for (const e of B.enemies){
    if (!e.alive && e.dying <= 0) continue;
    const sc = e.defId === "glacion" ? 2.4 : 2;
    const w = e.spr.width * sc, h = e.spr.height * sc;
    const yo = Math.sin((G.t + e.seed) / 22) * 2;
    const sx = e.shake > 0 ? irnd(-2, 2) : 0;
    let alpha = 1;
    if (!e.alive) alpha = e.dying / 40;
    ctx.globalAlpha = alpha;
    drawSpr(e.spr, e.x - w / 2 + sx, e.y - h / 2 + yo, { scale: sc });
    if (e.flashT > 0){ // single smooth fade, no strobe
      ctx.globalAlpha = 0.45 * (e.flashT / 10); ctx.fillStyle = "#ffffff";
      ctx.fillRect(e.x - w / 2, e.y - h / 2 + yo, w, h);
    }
    ctx.globalAlpha = 1;
    if (e.alive && B.state !== "bullets"){
      drawTextC(e.name, e.x, Math.min(e.y + h / 2 + 3, 74), e.spareable ? "#ffe14a" : "#c9c9d8");
      if (e.hpShow > 0){
        ctx.fillStyle = "#3a3f52"; ctx.fillRect(e.x - 20, e.y - h / 2 - 8, 40, 4);
        ctx.fillStyle = "#58c858"; ctx.fillRect(e.x - 20, e.y - h / 2 - 8, Math.max(0, 40 * e.hp / e.maxhp), 4);
      }
      if (e.spareable && (G.t >> 4) % 2 === 0) drawText("@", e.x + w / 2 + 2, e.y - h / 2, "#ffe14a");
    }
  }

  // TP bar (far left so it never overlaps enemies or the party panels)
  drawText("TP", 58, 52, "#f0a030");
  drawText(Math.round(G.tp) + "%", 46, 61, "#f0a030");
  ctx.fillStyle = "#3a3f52"; ctx.fillRect(60, 70, 8, 96);
  const tph = Math.round(96 * G.tp / 100);
  ctx.fillStyle = "#f0a030"; ctx.fillRect(60, 166 - tph, 8, tph);

  // box / message area
  const bx = B.box;
  if (B.state === "bullets"){
    drawBox(bx.x - 3, bx.y - 3, bx.w + 6, bx.h + 6, "#000000", "#ffffff");
    // timer bar
    ctx.fillStyle = "#3a3f52"; ctx.fillRect(bx.x, bx.y + bx.h + 6, bx.w, 3);
    ctx.fillStyle = "#f0a030"; ctx.fillRect(bx.x, bx.y + bx.h + 6, bx.w * (1 - B.phaseT / B.phaseLen), 3);
    // bullets
    for (const b of B.bullets) drawBullet(b);
    // soul
    const s = B.soul;
    if (s.inv <= 0 || (G.t >> 2) % 2 === 0) ctx.drawImage(soulSpr, s.x - 3, s.y - 3);
    if (held.x){ ctx.fillStyle = "rgba(255,255,255,0.8)"; ctx.fillRect(s.x - 1, s.y - 1, 2, 2); }
    if (B.tutHintT > 0){
      B.tutHintT--;
      drawTextC("DODGE! GRAZE CLOSE TO BULLETS FOR TP!", 160, bx.y - 12, "#ffe14a");
    }
  } else if (B.state === "fightbar"){
    const left = bx.x - 10, right = bx.x + bx.w + 10;
    drawBox(left - 4, 108, right - left + 8, 30, "#000000", "#ffffff");
    ctx.fillStyle = "#2a4a2a"; ctx.fillRect((left + right) / 2 - 14, 112, 28, 22);
    ctx.fillStyle = "#58c858"; ctx.fillRect((left + right) / 2 - 5, 112, 10, 22);
    ctx.fillStyle = "#ffffff"; ctx.fillRect(B.fightX - 2, 110, 4, 26);
    drawTextC("PRESS Z!", 160, 100, "#ffe14a");
  } else if (B.bubble && B.state === "edlg"){
    const e = B.bubble.e;
    const lines = wrapText(B.bubble.text, 24);
    const bw = Math.max(...lines.map(l => textW(l))) + 16;
    const bxp = clamp(e.x - bw / 2, 4, W - bw - 4), byp = 74;
    drawBox(bxp, byp, bw, lines.length * 10 + 12, "#ffffff", "#ffffff");
    lines.forEach((l, i) => drawText(l, bxp + 8, byp + 6 + i * 10, "#14141c"));
  } else {
    // message text
    const lines = wrapText(B.msg || "", 34);
    lines.slice(0, 4).forEach((l, i) => drawText("* " + l, 96, 84 + i * 12));
    if ((B.state === "msg" || B.state === "victory" || B.state === "fled" || B.state === "spareEnd") && B.stateT > 20 && (G.t >> 4) % 2 === 0)
      drawText("@", 300, 158, "#e03050");
  }

  // submenus
  if (B.state === "target"){
    const list = targetList();
    drawBox(96, 96, 128, 16 + list.length * 11);
    drawText(B.listKind === "SPARE" ? "SPARE WHO?" : B.listKind === "ACT" ? "ACT ON?" : "TARGET?", 104, 100, "#8a93a8");
    list.forEach((t, i) => {
      const col = t.e && t.e.spareable ? "#ffe14a" : (i === B.targetSel ? "#ffffff" : "#9aa2b8");
      drawText(t.label, 116, 110 + i * 11, i === B.targetSel ? (t.e && t.e.spareable ? "#ffe14a" : "#ffffff") : col);
      if (i === B.targetSel) ctx.drawImage(soulSpr, 106, 111 + i * 11);
    });
  }
  if (B.state === "list"){
    const list = listItems();
    drawBox(88, 70, 150, 18 + Math.max(1, list.length) * 11);
    const title = { MAGIC:"MAGIC (TP)", ITEM:"ITEMS", ACT2:"ACT HOW?", ALLY:"USE ON WHO?", HEALALLY:"HEAL WHO?" }[B.listKind] || "";
    drawText(title, 96, 74, "#8a93a8");
    list.forEach((it, i) => {
      let col = i === B.subSel ? "#ffffff" : "#9aa2b8";
      if (B.listKind === "MAGIC" && G.tp < it.s.cost) col = "#5a5f72";
      drawText(it.label, 108, 85 + i * 11, col);
      if (i === B.subSel) ctx.drawImage(soulSpr, 98, 86 + i * 11);
    });
    if (B.listKind === "MAGIC" && list[B.subSel])
      drawText(list[B.subSel].s.desc, 12, 52, "#8a93a8");

    if (f.kind === "slash"){
      ctx.fillStyle = f.col; ctx.fillRect(f.x, f.y, 10, 2);

    }
  }

  for (const d of B.dmgNums) drawTextC(d.s, d.x, d.y, d.col);

  // party panels (layout adapts to 3 or 4 members)
  const pg = panelGeom();
  G.party.forEach((p, i) => {
    const x = pg.x0 + i * pg.gap, y = 176;
    const active = B.state !== "bullets" && B.ci === i && ["menu", "target", "list", "fightbar"].includes(B.state);
    drawBox(x, y, pg.w, 34, p.hp <= 0 ? "#1a1218" : "#101018", active ? "#ffe14a" : "#5a5f72");
    drawText(p.name, x + 4, y + 4, p.hp <= 0 ? "#5a5f72" : p.col);
    hpBar(x + 4, y + 14, pg.w - 38, p.hp, p.maxhp);
    drawText(p.hp <= 0 ? "DOWN" : `${p.hp}`, x + pg.w - 30, y + 12, p.hp <= 0 ? "#e05858" : "#c9c9d8");
    if (B.defend[i]) drawText("GRD", x + pg.w - 30, y + 24, "#5ea8e8");
    if (active && (G.t >> 4) % 2 === 0) ctx.drawImage(soulSpr, x + pg.w - 10, y + 4);
  });

  // command row
  if (B.state === "menu" || B.state === "target" || B.state === "list"){
    let cx = 14;
    COMMANDS.forEach((c, i) => {
      const selCol = B.state === "menu" && B.menuSel === i ? "#ffe14a" : "#9aa2b8";
      drawText(c, cx + 8, 218, selCol);
      if (B.state === "menu" && B.menuSel === i) ctx.drawImage(soulSpr, cx, 219);
      cx += textW(c) + 16;
    });
    if (B.state === "menu")
      drawTextC(`${G.party[B.ci].name}'S MOVE`, 160, 230, G.party[B.ci].col);
  }
  if (B.state === "bullets"){
    drawTextC("ARROWS: MOVE   HOLD X: FOCUS", 160, 224, "#5a5f72");
  }
  // smooth fade-in from dark on battle start (no strobing)
  if (B.state === "intro"){
    const a = clamp(1 - B.stateT / 36, 0, 1);
    if (a > 0){ ctx.fillStyle = "rgba(4,5,10," + a.toFixed(3) + ")"; ctx.fillRect(-8, -8, W + 16, H + 16); }
  }
  ctx.restore();
  if (G.flash){
    ctx.globalAlpha = G.flash.a; ctx.fillStyle = G.flash.color; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
    G.flash.a -= 0.06; if (G.flash.a <= 0) G.flash = null;
  }
  drawDialog();
}
function drawBullet(b){
  ctx.fillStyle = b.col;
  if (b.kind === "pickle"){
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(Math.atan2(b.vy, b.vx));
    ctx.fillRect(-5, -2, 10, 4); ctx.restore();
  } else if (b.kind === "ring"){
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
    ctx.fillStyle = "#14141c"; ctx.beginPath(); ctx.arc(b.x, b.y, b.r - 2, 0, 7); ctx.fill();
  } else if (b.kind === "bounce"){
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
    ctx.fillStyle = "#b8923c";
    ctx.fillRect(b.x - 1, b.y - b.r + 1, 2, b.r * 2 - 2);
  } else if (b.kind === "egg"){
    ctx.beginPath(); ctx.ellipse(b.x, b.y, b.r - 1, b.r + 1, 0, 0, 7); ctx.fill();
  } else if (b.kind === "chip"){
    ctx.fillRect(b.x - 4, b.y - 3, 8, 2);
    ctx.fillRect(b.x - 3, b.y - 1, 6, 2);
    ctx.fillRect(b.x - 2, b.y + 1, 4, 2);
    ctx.fillRect(b.x - 1, b.y + 3, 2, 1);
  } else if (b.kind === "ball"){
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.7)"; ctx.fillRect(b.x - 2, b.y - 2, 2, 2);
  } else if (b.kind === "lag"){
    ctx.fillRect(b.x - 4, b.y - 2, 4, 4);
    ctx.fillStyle = b.col === "#e040c0" ? "#40e0d0" : "#e040c0";
    ctx.fillRect(b.x + 1, b.y - 1, 3, 3);
  } else if (b.kind === "homing"){
    const pulse = 1 + Math.sin(G.t / 4) * 0.3;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * pulse, 0, 7); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
  }
}

function ballpitPattern(e, t, spdMul){
  const box = B.box, ph = B.bossPhase;
  const cols = ["#e05858", "#58a0e0", "#ffe14a", "#58c858"];
  if (t % (ph >= 3 ? 46 : 60) === 10 && B.bullets.filter(b => b.kind === "ball").length < 3 + ph){
    const ang = rnd(0.5, 1.1) + pick([0, Math.PI / 2, Math.PI, -Math.PI / 2]);
    spawnBullet({ x: box.x + box.w / 2 + rnd(-34, 34), y: box.y + 10,
      vx: Math.cos(ang) * 1.7 * spdMul, vy: Math.abs(Math.sin(ang)) * 1.7 * spdMul + 0.4,
      r: 5, dmg: e.atk, col: pick(cols), kind:"bounce", life: 300 });
  }
  if (t % 40 === 24){
    const gap = (Math.sin(t * 0.019 + e.seed) * 0.5 + 0.5) * (box.w - 44) + box.x + 22;
    for (let x = box.x + 8; x < box.x + box.w - 4; x += 22)
      if (Math.abs(x - gap) >= 18)
        spawnBullet({ x, y: box.y + 4, vx: 0, vy: 1.3 * spdMul, r: 4, dmg: e.atk, col: pick(cols), kind:"ball" });
  }
  if (ph >= 2 && t % 13 === 0){
    const a = t * 0.15;
    spawnBullet({ x: box.x + box.w / 2, y: box.y + box.h / 2 - 12,
      vx: Math.cos(a) * 1.35 * spdMul, vy: Math.sin(a) * 1.35 * spdMul, r: 4, dmg: e.atk, col: pick(cols), kind:"ball" });
  }
  if (ph >= 3 && t % 130 === 65)
    spawnBullet({ x: box.x + 10, y: box.y + 8, vx: 0.5, vy: 0.5, r: 5, dmg: e.atk + 2, col:"#ffffff", kind:"homing", life: 250 });
}

let DRV = null;
function startDrive(){
  DRV = { t: 0, prog: 0, x: 160, y: 190, ob: [], iv: 0, hits: 0, rolls: 0 };
  G.mode = "drive";
  playMusic("drive");

function updateDrive(){
  const d = DRV;
  d.t++;
  if (d.iv > 0) d.iv--;
  if (G.shake > 0) G.shake--;
  if (d.arrived){
    if (d.blackout && (d.bt || 0) < 30) d.bt = (d.bt || 0) + 1;
    if (G.dialog) updateDialog();
    return;
  }
  const spd = 2.4;
  if (held.left) d.x -= spd; if (held.right) d.x += spd;
  if (held.up) d.y -= 1.6; if (held.down) d.y += 1.6;
  d.x = clamp(d.x, 92, 228); d.y = clamp(d.y, 110, 210);
  const interval = Math.max(26, 46 - Math.floor(d.prog / 4));
  if (d.t % interval === 0)
    d.ob.push({ x: rnd(96, 224), y: -20, vy: rnd(2.0, 2.9), kind: Math.random() < 0.22 ? "roll" : (Math.random() < 0.4 ? "car" : "cone") });
  for (const o of d.ob){
    o.y += o.vy + 1.2;
    const rw = o.kind === "car" ? 11 : 8;
    if (Math.abs(o.x - d.x) < rw + 8 && Math.abs(o.y - d.y) < (o.kind === "car" ? 16 : 10) + 12){
      if (o.kind === "roll"){
        o.y = 999; G.crumbs += 5; d.rolls++; SFX.heal();
      } else if (d.iv <= 0){
        d.iv = 50; d.hits++; d.prog = Math.max(0, d.prog - 4);
        SFX.hurt(); shake(5, 10);
      }
    }
  }
  d.ob = d.ob.filter(o => o.y < 260);
  d.prog += 0.075;
  if (d.prog >= 100){
    d.arrived = true;
    SFX.confirm();
    stopMusic();
    say(arrivalPart1(), () => {
      tone(400, 0.7, "sawtooth", 0.25, 40); // the power dies
      d.blackout = true;
      say(arrivalPart2(), () => {
        G.flags.ch2 = 1;
        enterRoom("conlobby", 60, 150, true);
        G.mode = "world";
        saveGame();
      });
    });
  }
}
function drawDrive(){
  const d = DRV;
  ctx.save();
  if (G.shake > 0) ctx.translate(irnd(-G.shakeMag, G.shakeMag), irnd(-G.shakeMag, G.shakeMag));
  // night roadside
  ctx.fillStyle = "#0a1420"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#12242e";
  for (let i = 0; i < 10; i++){
    const ty = (i * 53 + d.t * 2.2) % (H + 40) - 20;
    ctx.fillRect(30, ty, 22, 18); ctx.fillRect(268, ty + 26, 22, 18);
  }
  // road
  ctx.fillStyle = "#2a2d38"; ctx.fillRect(80, 0, 160, H);
  ctx.fillStyle = "#3a3e4c"; ctx.fillRect(80, 0, 4, H); ctx.fillRect(236, 0, 4, H);
  ctx.fillStyle = "#c9c95a";
  for (let ly = -32; ly < H; ly += 32){
    const yy = ly + (d.t * 3.4) % 32;
    ctx.fillRect(158, yy, 4, 16);
  }
  // obstacles
  for (const o of d.ob){
    if (o.kind === "cone"){
      ctx.fillStyle = "#e08a30"; ctx.fillRect(o.x - 5, o.y - 4, 10, 9);
      ctx.fillStyle = "#f5cd7a"; ctx.fillRect(o.x - 3, o.y - 1, 6, 2);
      ctx.fillStyle = "#c9c9d8"; ctx.fillRect(o.x - 7, o.y + 5, 14, 2);
    } else if (o.kind === "car"){
      ctx.fillStyle = "#4a5a8c"; ctx.fillRect(o.x - 9, o.y - 14, 18, 28);
      ctx.fillStyle = "#9fd8f0"; ctx.fillRect(o.x - 7, o.y + 6, 14, 6);
      ctx.fillStyle = "#e05858"; ctx.fillRect(o.x - 7, o.y - 13, 5, 3); ctx.fillRect(o.x + 2, o.y - 13, 5, 3);
    } else {
      drawSpr(rollSpr, o.x - 7, o.y - 5, {});
    }
  }
  // the pizza-mobile (blinks softly during i-frames)
  if (d.iv <= 0 || (G.t >> 3) % 2 === 0){
    ctx.fillStyle = "#8a3028"; ctx.fillRect(d.x - 10, d.y - 16, 20, 32);
    ctx.fillStyle = "#c04838"; ctx.fillRect(d.x - 8, d.y - 14, 16, 28);
    ctx.fillStyle = "#9fd8f0"; ctx.fillRect(d.x - 6, d.y - 12, 12, 6);
    ctx.fillStyle = "#f2ede2"; ctx.fillRect(d.x - 8, d.y - 4, 16, 4);
    ctx.fillStyle = "#ffe14a"; ctx.fillRect(d.x - 6, d.y + 10, 4, 3); ctx.fillRect(d.x + 2, d.y + 10, 4, 3);
    drawSpr(rollSpr, d.x - 7, d.y - 2, {});
    ctx.fillStyle = "rgba(255,225,74,0.12)";
    ctx.beginPath(); ctx.moveTo(d.x - 8, d.y - 16); ctx.lineTo(d.x - 16, d.y - 60); ctx.lineTo(d.x + 16, d.y - 60); ctx.lineTo(d.x + 8, d.y - 16); ctx.fill();
  }
  // HUD
  drawBox(60, 8, 200, 20);
  drawText("TO THE CON!", 68, 14, "#ffe14a");
  ctx.fillStyle = "#3a3f52"; ctx.fillRect(140, 14, 110, 8);
  ctx.fillStyle = "#58c858"; ctx.fillRect(140, 14, Math.round(110 * d.prog / 100), 8);
  drawTextC("ARROWS: STEER   GRAB ROLLS, DODGE THE REST", 160, 228, "#5a6078");
  if (d.blackout){
    ctx.fillStyle = `rgba(2,3,6,${Math.min(1, (d.bt || 0) / 30)})`;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
  drawDialog();
}

// ---- room102 pad puzzle ----
const PAD_DEFS = [ [60, 90, "#e05858"], [160, 90, "#58a0e0"], [60, 135, "#ffe14a"], [160, 135, "#58c858"] ];
function padTick(){
  if (G.flags.room102Done || G.dialog || G.menu) return;
  const fb = feetBox(player.x, player.y);
  for (let i = 0; i < PAD_DEFS.length; i++){
    const [px2, py2] = PAD_DEFS[i];
    if (overlaps(fb, { x: px2 - 9, y: py2 - 9, w: 18, h: 18 })){
      if (i === G.padProg){
        G.padProg++;
        SFX.tp();
        if (G.padProg >= 4){
          G.flags.room102Done = 1;
          SFX.levelup();
          say([{ t:"ALL FOUR PADS GLOW. SOMETHING HEAVY SLIDES OFF THE CLOSET SHELF. IT SOUNDS REFRESHING." }]);
        }
      } else if (i > G.padProg){
        G.padProg = 0;
        SFX.cancel();
      }
      return;
    }
  }
}
