// ch3 bullet patterns (registered into the battle engine)
Object.assign(EXTRA_PATTERNS, {
  staples(e, t, spdMul, box){
    if (t % 44 === 8){
      aimShot(e, box, 2.3 * spdMul, "#c9c9d8", "pickle", 3);
      if (e.maxhp - e.hp > 30) aimShot(e, box, 2.3 * spdMul, "#c9c9d8", "pickle", 3, 0.45);
    }
  },
  funk(e, t, spdMul, box){
    if (t % 12 === 0){
      const a = t * 0.14 + e.seed;
      spawnBullet({ x: box.x + box.w / 2, y: box.y + box.h / 2 - 14,
        vx: Math.cos(a) * 1.25 * spdMul, vy: Math.sin(a) * 1.25 * spdMul, r: 4, dmg: e.atk, col:"#e8a030", kind:"ring" });
    }
    if (t % 70 === 30) aimShot(e, box, 1.8 * spdMul, "#e040c0", "ball", 4);
  },
  drums(e, t, spdMul, box){
    // rows on the beat: left half, then right half — dodge to the rhythm
    if (t % 64 === 16)
      for (let x = box.x + 8; x < box.x + box.w / 2; x += 18)
        spawnBullet({ x, y: box.y + 4, vx: 0, vy: 1.5 * spdMul, r: 4, dmg: e.atk, col:"#40e0d0", kind:"ball" });
    if (t % 64 === 48)
      for (let x = box.x + box.w / 2 + 8; x < box.x + box.w - 4; x += 18)
        spawnBullet({ x, y: box.y + 4, vx: 0, vy: 1.5 * spdMul, r: 4, dmg: e.atk, col:"#e05858", kind:"ball" });
  },
  pow(e, t, spdMul, box){
    if (t % 56 === 12){
      const sx = box.x + 20 + rnd(0, box.w - 40), sy = box.y + 12;
      for (let k = 0; k < 4; k++){
        const a = Math.PI / 4 + k * Math.PI / 2;
        spawnBullet({ x: sx, y: sy, vx: Math.cos(a) * 1.5 * spdMul, vy: Math.sin(a) * 1.5 * spdMul, r: 4, dmg: e.atk, col:"#ffe14a", kind:"chip" });
      }
    }
    if (t % 48 === 30) aimShot(e, box, 2.1 * spdMul, "#f2ede8", "ball", 3);
  }
});
function rollyPattern(e, t, spdMul){
  const box = B.box, ph = B.bossPhase;
  if (t % (ph === 1 ? 42 : 56) === 8){
    aimShot(e, box, 2.2 * spdMul, "#c04838", "ball", 4);
    if (ph >= 2) aimShot(e, box, 2.2 * spdMul, "#c04838", "ball", 4, 0.5);
  }
  if (t % 46 === 24){
    const gap = (Math.sin(t * 0.02 + e.seed) * 0.5 + 0.5) * (box.w - 44) + box.x + 22;
    for (let x = box.x + 8; x < box.x + box.w - 4; x += 22)
      if (Math.abs(x - gap) >= 18)
        spawnBullet({ x, y: box.y + 4, vx: 0, vy: 1.35 * spdMul, r: 4, dmg: e.atk, col:"#f5cd7a", kind:"ball" });
  }
  if (ph >= 2 && t % 14 === 0){
    const a = t * 0.16;
    spawnBullet({ x: box.x + box.w / 2, y: box.y + box.h / 2 - 10,
      vx: Math.cos(a) * 1.3 * spdMul, vy: Math.sin(a) * 1.3 * spdMul, r: 3, dmg: e.atk, col:"#e040c0", kind:"ring" });
  }
  if (ph >= 3){
    if (t % 90 === 40 && B.bullets.filter(b => b.kind === "bounce").length < 3)
      spawnBullet({ x: box.x + 20, y: box.y + 12, vx: 1.6 * spdMul, vy: 1.4 * spdMul, r: 6, dmg: e.atk + 1, col:"#c07830", kind:"bounce", life: 280 });
    if (t % 140 === 70)
      spawnBullet({ x: box.x + box.w - 10, y: box.y + 8, vx: -0.5, vy: 0.5, r: 5, dmg: e.atk + 2, col:"#ffffff", kind:"homing", life: 250 });
  }
}

// disco deco helpers — slow, gentle color cycling only (no strobing)
function discoFloor(w, h){
  const pal = ["#2c1838", "#301c30", "#28203c", "#341c34"];
  for (let y = 0; y < h; y += 24)
    for (let x = 0; x < w; x += 24){
      const idx = (x / 24 + y / 24 + Math.floor(G.t / 60)) % 4;
      ctx.fillStyle = pal[idx];
      ctx.fillRect(x, y, 24, 24);
    }
}
function discoBall(x, y){
  ctx.fillStyle = "#8a93a8"; ctx.fillRect(x - 1, y - 6, 2, 6);
  ctx.fillStyle = "#c9c9d8"; ctx.beginPath(); ctx.arc(x, y + 6, 8, 0, 7); ctx.fill();
  ctx.fillStyle = "#e8e8f0";
  for (let i = 0; i < 4; i++){
    const a = G.t / 40 + i * 1.57;
    ctx.fillRect(x + Math.cos(a) * 5 - 1, y + 6 + Math.sin(a) * 5 - 1, 2, 2);
  }
}

Object.assign(EXTRA_PATTERNS, {
  lob(e, t, spdMul, box){
    const count = B.bullets.filter(b => b.kind === "bounce").length;
    if (t % 66 === 14 && count < 4){
      const ang = rnd(0.5, 1.2) + pick([0, Math.PI / 2, Math.PI, -Math.PI / 2]);
      spawnBullet({ x: box.x + box.w / 2 + rnd(-30, 30), y: box.y + 10,
        vx: Math.cos(ang) * 1.6 * spdMul, vy: Math.abs(Math.sin(ang)) * 1.6 * spdMul + 0.4,
        r: 5, dmg: e.atk, col: pick(["#5c6b52", "#6b5c52", "#3a4152"]), kind:"bounce", life: 300 });
    }
    if (t % 52 === 30) aimShot(e, box, 1.9 * spdMul, "#c9a05c", "ball", 4);
  },
  slip(e, t, spdMul, box){
    if (t % 40 === 8){
      aimShot(e, box, 2.7 * spdMul, "#ffe14a", "chip", 4, 0.55);
      aimShot(e, box, 2.7 * spdMul, "#ffe14a", "chip", 4, -0.55);

    if (t % 90 === 50) aimShot(e, box, 2.2 * spdMul, "#f2ede8", "ball", 3);
  },

    const ph = B.bossPhase;
    // the CHOMP: teeth close in from top and bottom, leaving a moving gap
    if (t % (ph >= 3 ? 52 : 64) === 20){
      const gap = (Math.sin(t * 0.017 + e.seed) * 0.5 + 0.5) * (box.w - 48) + box.x + 24;
      for (let x = box.x + 8; x < box.x + box.w - 4; x += 20)

          spawnBullet({ x, y: box.y + 4, vx: 0, vy: 1.1 * spdMul, r: 4, dmg: e.atk, col:"#f2ede8", kind:"chip" });

        }
    }
    if (t % 48 === 6) aimShot(e, box, 2.0 * spdMul, "#58a0e0", "ball", 4);
    if (ph >= 2 && t % 15 === 0){
      const a = t * 0.14;
      spawnBullet({ x: box.x + box.w / 2, y: box.y + box.h / 2 - 10,
        vx: Math.cos(a) * 1.25 * spdMul, vy: Math.sin(a) * 1.25 * spdMul, r: 4, dmg: e.atk, col:"#4a8f3c", kind:"ring" });

function postGatorScript(){
  if (G.flags.gatorSpared){
    return [
      { t:"SNAPJAW FLOATS ON HIS BACK, BELLY UP, RADIATING CONTENTMENT AND MILD EMBARRASSMENT." },
      { p:"mega", name:"MEGAFIRE", t:"WE'LL BRING YOU A WHOLE BAG OF ROLLS, BUDDY. WARM ONES. EVERY MONTH. I PROMISE." },
      { t:"THE LADDER RUNGS ARE BACK WHERE THEY BELONG. THE WAY HOME IS OPEN." }
    ];
  }
  return [
    { t:"THE POOL GOES STILL. AMONG THE HOARD: THE LADDER RUNGS, POLISHED LIKE TREASURE." },
    { p:"bob", name:"BOB", t:"...I KIND OF WANTED TO BE THE ONE TO EXPLODE HIM. EMOTIONALLY, I MEAN. LET'S GO HOME." },

}
function ladderScript(){
  return [
    { t:"THE LADDER STANDS WHOLE AGAIN, MORNING LIGHT SPILLING DOWN THE SHAFT." },
    { t:"CLIMB OUT? FOR REAL THIS TIME?", choices:[
      { t:"CLIMB OUT", fn(){

            { p:"dorko", name:"DORKO", t:"YOU EXPLODE ON COMMAND AND YOU'RE PUNCTUAL. HIRED. WELCOME TO THE PARTY, BOB." },

function checkDoughmerPhase(e){
  const frac = e.hp / e.maxhp;
  if (B.bossPhase === 1 && frac <= 0.66 && e.alive){
    B.bossPhase = 2;
    B.bossDlgQueue.push([
      { t:"DOUGHMER: MMM... FORBIDDEN DODGE-NUTS. *DISTRACTED DROOLING*" },
      { t:"HE FIGHTS AND SNACKS SIMULTANEOUSLY. TRULY, LEGALLY DISTINCT." }
    ]);
  }
  if (B.bossPhase === 2 && frac <= 0.33 && e.alive){
    B.bossPhase = 3;
    B.bossDlgQueue.push([
      { t:"DOUGHMER: WHY YOU LITTLE... ROLL-WITHHOLDERS!!" },
      { p:"bob", name:"BOB", t:"HE'S STRANGLING THE AIR! WHO IS HE STRANGLING?! THERE'S NOBODY THERE!" },

    ]);
  }
}
Object.assign(EXTRA_PATTERNS, {
  spin(e, t, spdMul, box){
    if (t % 10 === 0){
      const a = t * 0.2 + e.seed;
      spawnBullet({ x: box.x + box.w / 2, y: box.y + box.h / 2 - 12,
        vx: Math.cos(a) * 1.35 * spdMul, vy: Math.sin(a) * 1.35 * spdMul, r: 4, dmg: e.atk, col:"#58a0e0", kind:"ring" });
    }
    if (t % 80 === 40) aimShot(e, box, 2.0 * spdMul, "#ffffff", "ball", 4);
  },
  dough(e, t, spdMul, box){
    const ph = B.bossPhase;
    if (t % (ph === 1 ? 44 : 58) === 8){
      aimShot(e, box, 2.1 * spdMul, "#e8a0c0", "ring", 5);
      if (ph >= 2) aimShot(e, box, 2.1 * spdMul, "#c9a05c", "ring", 5, 0.5);
    }
    if (t % 50 === 26){
      const gap = (Math.sin(t * 0.018 + e.seed) * 0.5 + 0.5) * (box.w - 44) + box.x + 22;
      for (let x = box.x + 8; x < box.x + box.w - 4; x += 22)
        if (Math.abs(x - gap) >= 18)
          spawnBullet({ x, y: box.y + 4, vx: 0, vy: 1.3 * spdMul, r: 4, dmg: e.atk, col:"#e8a0c0", kind:"ring" });
    }
    if (ph >= 2 && t % 14 === 0){
      const a = t * 0.15;
      spawnBullet({ x: box.x + box.w / 2, y: box.y + box.h / 2 - 10,
        vx: Math.cos(a) * 1.3 * spdMul, vy: Math.sin(a) * 1.3 * spdMul, r: 3, dmg: e.atk, col:"#9fd8f0", kind:"ball" });
    }
    if (ph >= 3 && t % 120 === 60)
      spawnBullet({ x: box.x + box.w - 12, y: box.y + 8, vx: -0.5, vy: 0.5, r: 5, dmg: e.atk + 2, col:"#9fd8f0", kind:"homing", life: 250 });
  }
});

    ctx.fillStyle = (Math.floor(G.t / 40) + ry) % 3 === 0 ? "#58c858" : "#1c4a2c";

    ctx.fillStyle = (Math.floor(G.t / 52) + ry) % 4 === 0 ? "#e05858" : "#4a1c1c";

  }
}

    }

  },

    const ph = B.bossPhase;

          spawnBullet({ x, y: box.y + 4, vx: 0, vy: 1.35 * spdMul, r: 4, dmg: e.atk, col:"#ffe14a", kind:"chip" });

  }
});

// ================= STORY / CUTSCENES =================
function newGame(){
  G.party = newParty();
  G.tp = 0; G.crumbs = 30; G.inv = ["crust", "crust", "juice"];
  G.lv = 1; G.exp = 0; G.kills = 0; G.spares = 0; G.flags = {};
  for (const k in talkCounts) delete talkCounts[k];
  enterRoom("landing", 60, 150, true);
  G.mode = "world";
  G.fade.a = 1; G.fade.dir = 0; G.fade.cb = null; // hold black for narration
  say([
    { t:"SOMEWHERE IN A KITCHEN, AT PRECISELY SNACK O'CLOCK..." },
    { p:"dorko", name:"DORKO", t:"PIZZA ROLLS. I CAN FEEL THEM. NOTHING ELSE CURRENTLY MATTERS." },
    { p:"mega", name:"MEGAFIRE", t:"DORKO, IT'S BEEN HOURS. I CAN'T FEEL MY HANDS AND I'M STARTING TO HAVE FEELINGS ABOUT THIS FREEZER. BAD ONES." },
    { p:"bmo", name:"BMO", t:"GUYS. THIS SHELF HAS 'TRAP FLOOR' WRITTEN ALL OVER IT. I'VE CLEARED ENOUGH DUNGEONS TO KNOW A-" },
    { t:"THE SHELF GIVES WAY." }
  ], () => {
    SFX.fall();
    G.fade.dir = -1;
    setTimeout(() => { SFX.boom(); shake(6, 20); }, 500);
    say([
      { p:"dorko", name:"DORKO", t:"HEADCOUNT. THREE. GOOD. THE ROLLS ARE CLOSE, I CAN TELL." },
      { p:"mega", name:"MEGAFIRE", t:"ALIVE. TRAGICALLY, STILL COLD. WHY DO WE SUFFER LIKE THIS." },
      { p:"bmo", name:"BMO", t:"SOFT LANDING. ZERO FALL DAMAGE. MY HAT TANKED IT LIKE A CHAMP." },
      { t:"YOU HAVE FALLEN INTO THE COLD WORLD... THE SECRET KINGDOM INSIDE THE FRIDGE." },
      { p:"mega", name:"MEGAFIRE", t:"...THE FRIDGE HAS A KINGDOM? HOW LONG HAS IT BEEN DOWN HERE? HOW LONG HAVE WE BEEN UP THERE... EATING ITS PEOPLE?" },
      { p:"bmo", name:"BMO", t:"WELL, NEW QUEST: FIND THE PIZZA ROLLS. AND NO, WE CAN'T SKIP THIS CUTSCENE. I ALREADY TRIED." },
      { p:"dorko", name:"DORKO", t:"ROLLS FIRST. QUESTIONS NEVER. EAST." }
    ], () => { G.flags.introDone = 1; saveGame(); });
  });
}

// ================= GAME OVER =================
let GO = null;
function startGameOver(){
  B = null; GO = { t: 0, shards: [] };
  G.mode = "gameover";
  stopMusic();
  playJingle("gameover");
}
function updateGameOver(){
  GO.t++;
  if (GO.t === 60){
    SFX.shatter();
    for (let i = 0; i < 14; i++)
      GO.shards.push({ x: 160, y: 100, vx: rnd(-2.2, 2.2), vy: rnd(-3, -0.5), t: 0 });
  }
  GO.shards.forEach(s => { s.t++; s.x += s.vx; s.y += s.vy; s.vy += 0.08; });
  if (GO.t > 140 && pressed.z){
    eat("z"); SFX.confirm();
    GO = null;
    if (hasSave() && loadGame()) G.mode = "world";
    else newGame();
  }
}
function drawGameOver(){
  ctx.fillStyle = "#060408"; ctx.fillRect(0, 0, W, H);
  if (GO.t < 60){
    const blink = (GO.t >> 3) % 2 === 0;
    if (blink || GO.t < 30) drawSpr(soulSpr, 160 - soulSpr.width * 1.5, 100 - soulSpr.height * 1.5, { scale: 3 });
  } else {
    ctx.fillStyle = "#e03050";
    GO.shards.forEach(s => { if (s.y < H) ctx.fillRect(s.x, s.y, 3, 3); });
  }
  if (GO.t > 90){
    ctx.save(); ctx.scale(2, 2);
    drawTextC("GAME OVER", 80, 30, "#e03050");
    ctx.restore();
    drawTextC("YOU CANNOT GIVE UP JUST YET...", 160, 140, "#c9c9d8");
    drawTextC("THE PIZZA ROLLS STILL BELIEVE IN YOU.", 160, 152, "#c9c9d8");
    if (GO.t > 140 && (G.t >> 4) % 2 === 0)
      drawTextC("PRESS Z TO RETRY", 160, 180, "#ffe14a");
  }
}

// ================= TITLE =================
function gotoTitle(){
  G.mode = "title"; G.titleSel = 0; playMusic("town");
  try {
    const d = JSON.parse(localStorage.getItem("fridgequest"));
    if (d && d.flags && d.flags.gotRolls) G.flags.gotRolls = 1;
  } catch (e) {}
}
function titleOptions(){ return hasSave() ? ["CONTINUE", "NEW GAME"] : ["NEW GAME"]; }
function updateTitle(){
  const opts = titleOptions();
  if (pressed.up || pressed.down){ eat("up"); eat("down"); G.titleSel = (G.titleSel + 1) % opts.length; SFX.move(); }
  if (pressed.z){
    eat("z"); SFX.confirm();
    const sel = opts[G.titleSel];
    if (sel === "CONTINUE"){ if (loadGame()){ G.mode = "world"; } else newGame(); }
    else newGame();
  }
}
function drawTitle(){
  const grd = ctx.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, "#0c1230"); grd.addColorStop(1, "#04050c");
  ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H);
  // snow
  ctx.fillStyle = "#9fb8d8";
  for (let i = 0; i < 40; i++){
    const sx = (i * 53 + Math.sin(i * 3 + G.t / 90) * 20 + G.t / 6 * ((i % 3) - 1) * 0.3 + i * 17) % W;
    const sy = (i * 91 + G.t * (0.3 + (i % 5) * 0.12)) % H;
    ctx.fillRect((sx + W) % W, sy, i % 3 === 0 ? 2 : 1, i % 3 === 0 ? 2 : 1);
  }
  ctx.save(); ctx.scale(2, 2);
  drawTextC("FRIDGE QUEST", 80, 24, "#9fd8f0");
  ctx.restore();
  drawTextC("AND THE MYTHICAL PIZZA ROLLS", 160, 66, "#ffe14a");
  drawSpr(rollSpr, 160 - rollSpr.width * 1.5, 92 + Math.sin(G.t / 24) * 4, { scale: 3 });
  const opts = titleOptions();
  opts.forEach((o, i) => {
    const y = 150 + i * 14;
    drawTextC(o, 160, y, G.titleSel === i ? "#ffe14a" : "#8a93a8");
    if (G.titleSel === i) ctx.drawImage(soulSpr, 160 - textW(o) / 2 - 12, y);
  });
  drawTextC("Z SELECT - ARROWS MOVE - X RUN - C MENU - M MUTE", 160, 210, "#4a5068");
  drawTextC("A COLD TALE OF WARM FRIENDS", 160, 224, "#3a4058");
  if (G.flags.gotRolls) drawTextC("* QUEST COMPLETE *", 160, 132, "#58c858");
}

// ================= ENDING =================
function updateEnd(){
  G.endTimer++;
  if (G.endTimer > 90 && pressed.z){ eat("z"); SFX.confirm(); gotoTitle(); }
}
function drawEnd(){
  ctx.fillStyle = "#08060c"; ctx.fillRect(0, 0, W, H);
  // pizza roll rain
  for (let i = 0; i < 12; i++){
    const sx = (i * 97) % W;
    const sy = (i * 61 + G.endTimer * (0.4 + (i % 4) * 0.2)) % (H + 20) - 10;
    drawSpr(rollSpr, sx, sy, { scale: 1, alpha: 0.4 });
  }
  const route = G.flags.endRoute || endRoute();
  ctx.save(); ctx.scale(2, 2);
  drawTextC("THE END", 80, 8, "#ffe14a");
  ctx.restore();
  const sub = route === "pacifist" ? ["THE WARM ENDING", "#58c858"]
            : route === "violent" ? ["THE COLD ENDING", "#9fd8f0"]
            : ["THE SNACK ENDING", "#ffe14a"];
  drawTextC(sub[0], 160, 36, sub[1]);
  if (G.flags.ch6Done) drawTextC("ALL SIX CHAPTERS COMPLETE", 160, 46, "#e040c0");
  else if (G.flags.ch5Done) drawTextC("CHAPTERS 1 + 2 + 3 + 4 + 5 COMPLETE", 160, 46, "#e040c0");
  else if (G.flags.ch4Done) drawTextC("CHAPTERS 1 + 2 + 3 + 4 COMPLETE", 160, 46, "#e040c0");
  else if (G.flags.ch3Done) drawTextC("CHAPTERS 1 + 2 + 3 COMPLETE", 160, 46, "#e040c0");
  else if (G.flags.ch2Done) drawTextC("CHAPTERS 1 + 2 COMPLETE", 160, 46, "#e040c0");
  // the party bows up front; everyone you kept bows behind
  const partyRow = [dorkoFront, megaFront, bmoFront];
  if (G.flags.ch4Done) partyRow.push(bobSpr);
  const friends = [];
  if (route === "pacifist"){
    friends.push(gherkinSpr, eggbertSpr, onionSpr, kongySpr, glacionSpr);
    if (G.flags.secretSpared) friends.push(chipsSpr);
  } else if (route === "neutral"){
    if (G.flags.kongySpared) friends.push(kongySpr);
    if (G.flags.bossSpared) friends.push(glacionSpr);
    if (G.flags.secretSpared) friends.push(chipsSpr);
  }
  if (G.flags.ch2Done){
    friends.push(syxSpr);
    if (G.flags.ballpitSpared && route !== "violent") friends.push(congoerSpr);
  }
  if (G.flags.ch3Done){
    friends.push(mgSpr);
    if (G.flags.rollySpared && route !== "violent") friends.push(rollySpr);
  }
  if (G.flags.ch4Done && G.flags.gatorSpared && route !== "violent") friends.push(gatorSpr);
  if (G.flags.ch5Done){
    friends.push(mrpSpr);
    if (G.flags.doughmerSpared && route !== "violent") friends.push(doughmerSpr);
  }
  if (G.flags.ch6Done){
    friends.push(paperoSpr);
    if (G.flags.mcronaldSpared && route !== "violent") friends.push(mcronaldSpr);
  }
  const drawRow = (row, baseY) => {
    const gap = row.length > 12 ? 2 : row.length > 9 ? 3 : 6;
    const totalW = row.reduce((a, s) => a + s.width, 0) + gap * (row.length - 1);
    let lx = 160 - totalW / 2;
    row.forEach((s, i) => {
      const yo = Math.sin(G.t / 18 + i * 0.9) * 2;
      drawSpr(s, lx, baseY - s.height + yo, {});
      lx += s.width + gap;
    });
  };
  drawRow(partyRow, 78);
  if (friends.length) drawRow(friends, 106);
  const flavor = route === "pacifist" ? "EVERY SNACK YOU EVER MET CALLS YOU FRIEND."
              : route === "violent" ? "IT'S QUIET. JUST YOUR PARTY, AND THE HUM."
              : "SOME FRIENDS, SOME FOES, ALL FED.";
  drawTextC(flavor, 160, 114, "#c9c9d8");
  drawTextC(`SNACKS BEFRIENDED: ${G.spares}   SNACKS DEFEATED: ${G.kills}`, 160, 128, "#8a93a8");
  drawTextC(`FINAL LV ${G.lv} - CRUMBS ${G.crumbs}`, 160, 140, "#8a93a8");
  if (route === "pacifist") drawTextC("CLEANEST HANDS IN THE CRISPER!", 160, 154, "#58c858");
  if (route === "violent") drawTextC("THE FRIDGE REMEMBERS.", 160, 154, "#9fd8f0");
  if (G.flags.secretDone)
    drawTextC(G.flags.secretSpared ? "CRISPUS KNOWS WHERE HE LIVES NOW." : "THE TOP SHELF IS SILENT.", 160, 166, "#e8a030");
  drawTextC("THE MYTHICAL PIZZA ROLLS WERE REAL.", 160, 182, "#5a6078");
  drawTextC("THANKS FOR PLAYING!", 160, 194, "#5a6078");
  if (G.endTimer > 90 && (G.t >> 4) % 2 === 0)
    drawTextC("PRESS Z", 160, 210, "#ffe14a");
}

// ================= MAIN LOOP =================
function step(){
  G.t++;
  if (pressed.m){ eat("m"); toggleMute(); }
  switch (G.mode){
    case "title": updateTitle(); break;
    case "world": updateWorld(); break;
    case "battle": if (B) updateBattle(); break;
    case "drive": if (DRV) updateDrive(); break;
    case "gameover": if (GO) updateGameOver(); break;
    case "end": updateEnd(); break;
  }
  if (G.mode !== "battle" && G.shake > 0) G.shake--;
  clearPressed();
}
function render(){
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  switch (G.mode){
    case "title": drawTitle(); break;
    case "world": drawWorld(); break;
    case "battle": if (B) drawBattle(); break;
    case "drive": if (DRV) drawDrive(); break;
    case "gameover": if (GO) drawGameOver(); break;
    case "end": drawEnd(); break;
  }
  sctx.imageSmoothingEnabled = false;
  sctx.drawImage(vc, 0, 0, W * SCALE, H * SCALE);
}
let lastT = performance.now(), acc = 0;
function frame(now){
  requestAnimationFrame(frame);
  acc += now - lastT; lastT = now;
  if (acc > 120) acc = 120;
  while (acc >= 16.667){ step(); acc -= 16.667; }
  render();
}
gotoTitle();
requestAnimationFrame(frame);
</script>
